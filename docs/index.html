function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let S=migrate(loadLocal());

const cloud={ref:null,status:'local'};let writing=false,again=false,saveTimer=null;
function save(){S.updatedAt=Date.now();saveLocal();clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,700)}
async function pushCloud(){
  if(!cloud.ref)return; if(writing){again=true;return}
  writing=true;
  try{await cloud.ref.set({updatedAt:S.updatedAt,data:JSON.parse(JSON.stringify(S))});cloud.status='cloud'}catch(e){cloud.status='error'}
  writing=false;renderSync();if(again){again=false;pushCloud()}
}
/* Synchronizacja: w claude.ai przez capability db, w aplikacji na telefon przez Firebase (window.ARABESKA_AUTH z build_pwa.py). */
async function initCloud(){
  const A=window.ARABESKA_AUTH;
  if(A){A.onChange(ref=>{if(cloud.unsub){cloud.unsub();cloud.unsub=null}cloud.ref=null;cloud.status='local';if(ref)attachCloud(ref);else{renderSync();if(!P)render()}});return}
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    attachCloud(db.doc('data/users/'+id+'/state'));
  }catch(e){cloud.status='error';renderSync()}
}
/* Automatyczne kopie: zanim dane z konta zastąpią dane w urządzeniu (albo odwrotnie), poprzednia wersja trafia tutaj. */
const BK='arabeska.backups',ACCT='arabeska.acct';
function loadBackups(){try{const r=JSON.parse(localStorage.getItem(BK)||'[]');return Array.isArray(r)?r:[]}catch(e){return[]}}
function backup(state,why){
  if(!state||!(state.log||[]).length&&!state.updatedAt)return;
  try{const b=loadBackups();const j=JSON.stringify(state);if(b.some(x=>JSON.stringify(x.data)===j))return;
    b.unshift({at:Date.now(),why,data:JSON.parse(j)});localStorage.setItem(BK,JSON.stringify(b.slice(0,6)))}catch(e){}
}
const weight=s=>(s.log||[]).length*10+Object.values(s.tests||{}).reduce((a,v)=>a+(v||[]).filter(x=>!x.est).length,0)+(s.corrections||[]).length+(s.combos||[]).length;
/* Łączy dwie wersje danych bez gubienia wpisów: bazą jest bogatsza, z drugiej dochodzi to, czego brakuje. */
function mergeStates(a,b){
  const [base,other]=weight(a)>=weight(b)?[a,b]:[b,a];
  const o=migrate(JSON.parse(JSON.stringify(base))),x=migrate(JSON.parse(JSON.stringify(other)));
  const ids=new Set(o.log.map(l=>l.id));for(const l of x.log)if(!ids.has(l.id))o.log.push(l);
  o.log.sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0);
  for(const k in x.tests){const cur=o.tests[k]||[];
    const add=x.tests[k].filter(t=>!t.est&&!cur.some(c=>c.d===t.d&&c.v===t.v));
    o.tests[k]=cur.concat(add).sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0)}
  for(const k of['corrections','combos']){const seen=new Set(o[k].map(v=>JSON.stringify(v)));for(const v of x[k])if(!seen.has(JSON.stringify(v)))o[k].push(v)}
  for(const k of['videos','flags','steps','ytPick','pointeChecks','vars','pron','moves','legacy'])for(const kk in x[k])if(!(kk in o[k]))o[k][kk]=x[k][kk];
  /* kamienie milowe: najwcześniejsza data */
  for(const kk in x.ms)if(!o.ms[kk]||x.ms[kk]<o.ms[kk])o.ms[kk]=x.ms[kk];
  return o;
}
async function attachCloud(ref){
  cloud.ref=ref;
  const acct=String(ref.path||ref.id||'claude');
  let known;try{known=localStorage.getItem(ACCT)===acct}catch(e){known=false}
  try{
    const snap=await cloud.ref.get();
    if(cloud.ref!==ref)return;
    const d=snap.exists?snap.data():null;
    if(d&&d.data&&!known){
      /* To urządzenie nie było jeszcze połączone z tym kontem: nie nadpisujemy niczego, tylko łączymy obie wersje. */
      backup(S,'Dane z tego urządzenia przed połączeniem z kontem');backup(d.data,'Dane z konta przed połączeniem z tym urządzeniem');
      S=mergeStates(S,d.data);S.updatedAt=Date.now();saveLocal();pushCloud();
    } else if(d&&d.data&&(d.updatedAt||0)>(S.updatedAt||0)){backup(S,'Dane z tego urządzenia przed pobraniem z konta');S=migrate(JSON.parse(JSON.stringify(d.data)));saveLocal()}
    else if(d&&(S.updatedAt||0)>(d.updatedAt||0)){if(d.data)backup(d.data,'Dane z konta przed zapisem z tego urządzenia');pushCloud()}
    else if(!d&&S.updatedAt)pushCloud();
    try{localStorage.setItem(ACCT,acct)}catch(e){}
    cloud.status='cloud';renderSync();if(!P)render();
    cloud.unsub=ref.onSnapshot(sn=>{
      if(!sn.exists||sn.metadata.hasPendingWrites)return;
      const d=sn.data();
      if(d&&d.data&&(d.updatedAt||0)>(S.updatedAt||0)){backup(S,'Dane z tego urządzenia przed pobraniem z konta');S=migrate(JSON.parse(JSON.stringify(d.data)));saveLocal();if(!P)render()}
    },()=>{});
  }catch(e){if(cloud.ref===ref){cloud.status='error';renderSync()}}
}

/* ============ LOGIKA PLANU ============ */
const TRAIN_KINDS=['session','class','quick'];
/* przełożone treningi: S.moves[dzień z planu] = dzień, na który trening przełożono */
const movedFrom=d=>Object.keys(S.moves).find(k=>S.moves[k]===d&&S.days.includes(dow(k)));
function isTrainDay(d){return S.days.includes(dow(d))?!S.moves[d]:!!movedFrom(d)}
function trainingIndex(date){let n=0,d=S.planStart;if(date<=d)return 0;let guard=0;while(d<date&&guard++<4000){if(isTrainDay(d))n++;d=addDays(d,1)}return n}
/* ITEM po rozwiązaniu bramki kamienia milowego i zamianie pointów na półpalce (S.pointe===false); null = pomiń */
function resolveItem(it){
  if(it.gate&&!gateOpen(it.gate))it=it.alt||null;
  if(!it)return null;
  const ex=EX[it.e];
  if(ex&&ex.pointe&&S.pointe===false){
    if(!ex.alt||!EX[ex.alt])return null;
    const long=(it.r||0)*(it.rt||4)>=60;
    return Object.assign({},it,{e:ex.alt,swapped:it.e},long?{r:10,rt:7}:{});
  }
  return it;
}
/* tydzień lżejszy: bez pozycji nodl, mniej serii, ok. 70% czasu i powtórzeń */
function lighterItem(it){
  const o=Object.assign({},it);
  if(o.s>1)o.s=o.s-1;
  if(o.t)o.t=Math.max(5,Math.round(o.t*.7/5)*5);
  if(o.r)o.r=Math.ceil(o.r*.7);
  return o;
}
/* blok planu w danym dniu. o = {ph, deload, short, raw}: wymuszenie fazy / tygodnia lżejszego / trybu krótkiego; raw = bez przekształceń (lista fazy) */
function progBlock(p,date,o){
  o=o||{};const P0=PROG[p];const st=S.progStart[p]||S.planStart;
  const wk=Math.max(1,Math.floor(between(st,date)/7)+1);
  const ph=o.ph!=null?o.ph:Math.min(2,Math.floor((wk-1)/4));
  const deload=o.deload!=null?!!o.deload:wk%4===0;
  const short=o.short!=null?!!o.short:!!S.short;
  const phase=P0.phases[ph];
  let items=phase.items.map(resolveItem).filter(Boolean);
  if(!o.raw){
    if(short)items=items.filter(it=>!it.opt);
    if(deload)items=items.filter(it=>!it.nodl).map(lighterItem);
  }
  return {n:P0.n,prog:p,area:P0.area,kind:P0.kind,wk,weeks:P0.weeks,ph,phase:{n:phase.n,d:phase.d},deload,cycleDone:wk>P0.weeks,
    pointeSwap:items.some(it=>it.swapped),items};
}
/* plany na trening nr i: [technika, rozciąganie]; gdy jedna kolejka pusta, dwa różne plany z drugiej */
function sessionProgs(i,act){
  const T=TECH_CYCLE.filter(p=>act.includes(p)),F=FLEX_CYCLE.filter(p=>act.includes(p));
  if(T.length&&F.length)return [T[i%T.length],F[i%F.length]];
  const X=T.length?T:F;if(!X.length)return [];
  const a=X[(2*i)%X.length];let b=null;
  for(let k=0;k<X.length;k++){const c=X[(2*i+1+k)%X.length];if(c!==a){b=c;break}}
  return b?[a,b]:[a];
}
/* skład treningu z planów; o jak w progBlock (dla selfCheck i podglądu) */
function composeSession(progs,date,o){
  o=o||{};const short=o.short!=null?!!o.short:!!S.short;
  const light=o.light!=null?!!o.light:(fatigue()&&date>=today());
  /* RPE i tydzień lżejszy nie sumują się: blok w tygodniu lżejszym nie dostaje drugiego odchudzenia */
  const lighten=b=>light&&!b.deload?Object.assign({},b,{items:b.items.map(it=>Object.assign({},it,{t:it.t?Math.round(it.t*.7/5)*5:it.t,r:it.r?Math.ceil(it.r*.7):it.r,s:undefined}))}):b;
  const st=short?null:focusStep();
  const learn=st?[{n:'Nauka kroku: '+st.n,step:st.id,items:[{e:'step:'+st.id,t:180}]}]:[];
  const cool=(progs.includes('back')?COOL_BACK:COOL).filter(it=>!short||!it.opt);
  const blocks=progs.map(p=>lighten(progBlock(p,date,o)));
  return {blocks:[{n:'Rozgrzewka',items:WARM},...learn,...blocks,{n:'Wyciszenie',items:cool}],light,
    deload:blocks.some(b=>b.deload),pointeSwap:blocks.some(b=>b.pointeSwap)};
}
function planFor(date){
  if(!isTrainDay(date)){
    return {date,kind:'recovery',title:'Regeneracja',blocks:[{n:'Regeneracja',items:RECOVERY}]};
  }
  let act=S.active.filter(id=>PROG[id]);if(!act.length)act=PLAN_IDS.slice();
  const i=trainingIndex(date);
  const progs=sessionProgs(i,act);
  const c=composeSession(progs,date);
  const vids=progs.map(p=>{const b=c.blocks.find(x=>x.prog===p);const L=planFollow(p,b?b.ph:null);if(!L.length)return null;
    const key=date+':'+p;const n=(S.ytPick[key]!=null?S.ytPick[key]:i)%L.length;return {p,v:L[n],n,key,list:L}}).filter(Boolean);
  return {date,kind:'session',title:progs.map(p=>PROG[p].n).join(' + '),progs,vids,i,light:c.light,deload:c.deload,pointeSwap:c.pointeSwap,
    cue:progs[0]?PROG[progs[0]].cue:'',blocks:c.blocks};
}
/* zmęczenie: średnia ocena RPE trzech ostatnich treningów z ostatnich 14 dni wynosi 8 lub więcej */
function fatigue(){
  if(S.flags.noDeload===today())return false;
  const r=S.log.filter(l=>l.rpe&&TRAIN_KINDS.includes(l.kind)&&between(l.d,today())<=14).sort((a,b)=>a.d<b.d?1:-1).slice(0,3);
  return r.length===3&&r.reduce((a,l)=>a+l.rpe,0)/3>=8;
}
/* słabsza strona dla kategorii ćwiczenia, na podstawie pomiarów prawej i lewej */
const SIDE_TESTS={split:['split_r','split_l',1],turn:['pir1_r','pir1_l',0],feet:['calf_r','calf_l',0],pointe:['pointe1_r','pointe1_l',0],str:['side_r','side_l',0]};
function weakerSide(cat){
  let p=SIDE_TESTS[cat];if(!p)return null;
  if(cat==='turn'&&latest('pir2_r',true)&&latest('pir2_l',true))p=['pir2_r','pir2_l',0];
  const r=latest(p[0]),l=latest(p[1]);if(!r||!l)return null;
  const lower=p[2];const diff=Math.abs(r.v-l.v);const base=Math.max(Math.abs(r.v),Math.abs(l.v),1);
  if(lower?diff<3:(diff<1||diff/base<.15))return null;
  const rightWeak=lower?r.v>l.v:r.v<l.v;
  return {side:rightWeak?'Prawa strona':'Lewa strona',word:rightWeak?'prawą':'lewą',test:T_BY[p[0]].n.split(':')[0]};
}
/* krok do nauki: najpierw ten oznaczony „uczę się”, potem pierwszy nieznany z bieżącej klasy (tylko balet) */
function focusStep(){
  const learning=STEPS.find(s=>S.steps[s.id]===1);if(learning)return learning;
  return STEPS.find(s=>s.lv===S.level&&!S.steps[s.id])||STEPS.find(s=>s.lv>S.level&&!S.steps[s.id])||null;
}
/* ćwiczenie po id; 'step:<id>' = nauka kroku; ćwiczenie w pointach przy S.pointe===false = zamiennik na półpalcach */
function exGet(id){
  if(id.startsWith('step:')){const s=STEP_BY[id.slice(5)];if(!s)return {n:id.slice(5),c:'turn',d:'',cues:[],yt:id.slice(5)};
    const L=linksFor('step',s.id);const fr=SAY[s.id]||s.n;
    return {n:s.n,fr,ph:s.ph||phOf(fr),c:'turn',d:s.d+' Ćwicz powoli, najpierw przy drążku, potem na środku.',cues:s.how,yt:s.yt+' ballet',url:L[0]?L[0].url:null,step:s.id}}
  const ex=EX[id];if(!ex)return {n:id,c:'warm',d:'',cues:[],yt:id};
  if(ex.pointe&&S.pointe===false&&ex.alt&&EX[ex.alt])return EX[ex.alt];
  return ex;
}
/* kroki odtwarzacza; dodatkowa seria na słabszą stronę najwyżej raz na blok (pierwsze ćwiczenie na stronę z taką kategorią) */
function stepsOf(plan){
  const out=[];
  for(const b of plan.blocks){let extra=false;
    for(const it of b.items){
      const ex=exGet(it.e);const sides=ex.sd?['Prawa strona','Lewa strona']:[null];const sets=it.s||1;
      const base={block:b.n,area:b.area||null,e:it.e,t:it.t,r:it.r,rt:it.rt||4,fr:ex.fr||'',ph:ex.fr?phOf(ex):''};
      for(let s=1;s<=sets;s++)for(const side of sides)out.push(Object.assign({},base,{side,set:s,sets}));
      const w=!extra&&ex.sd&&plan.kind==='session'?weakerSide(ex.c):null;
      if(w){extra=true;out.push(Object.assign({},base,{side:w.side,set:1,sets:1,extra:1}))}
    }
  }
  return out;
}
const stepSec=st=>(st.t?st.t+5:st.r*st.rt+6);
const planMin=plan=>Math.round(stepsOf(plan).reduce((a,s)=>a+stepSec(s),0)/60);
const blockMin=b=>Math.round(stepsOf({blocks:[b]}).reduce((a,s)=>a+stepSec(s),0)/60);
const logsOn=d=>S.log.filter(l=>l.d===d);
const doneSession=d=>S.log.some(l=>l.d===d&&l.kind==='session');

/* ============ LOGIKA CELÓW ============ */
/* pięty razem, każda stopa obrócona o połowę kąta: odległość czubków = 2·L·sin(kąt/2) */
const turnoutDeg=d=>Math.round(2*Math.asin(clamp(d/(2*S.footCm),0,1))*180/Math.PI);
/* real = tylko prawdziwe pomiary (bez szacunków ≈); st = stan (domyślnie S, w migracji stan migrowany) */
function rawHist(id,real,st){return ((st||S).tests[id]||[]).filter(m=>!real||!m.est).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
/* pomiar „słabsza strona”: od dnia, gdy są obie strony, liczony jako minimum z ostatnich wyników prawej i lewej */
function hist(id,real,st){
  const T=T_BY[id];const base=rawHist(id,real,st);if(!T||!T.of)return base;
  const sides=T.of.map(x=>rawHist(x,real,st));if(sides.some(h=>!h.length))return base;
  const dates=[...new Set(sides.flat().map(m=>m.d))].sort();const pts=[];
  for(const d of dates){const vals=sides.map(h=>{let v=null;for(const m of h)if(m.d<=d)v=m.v;return v});if(vals.every(v=>v!=null))pts.push({d,v:Math.min(...vals)})}
  return base.filter(m=>m.d<pts[0].d).concat(pts);
}
function latest(id,real,st){const h=hist(id,real,st);return h.length?h[h.length-1]:null}
function fromVal(level,tid){for(let l=level-1;l>=1;l--){const r=LEVELS[l-1].req;if(r&&r[tid]!=null)return r[tid]}return T_BY[tid].floor}
function levelStatus(){
  const L=LEVELS[S.level-1];if(!L.req)return {max:true,items:[],pct:1,ready:false};
  const items=Object.entries(L.req).map(([tid,target])=>{
    const T=T_BY[tid];const m=latest(tid);const cur=m?m.v:null;const from=fromVal(S.level,tid);
    let f=0,gap;
    if(cur==null){gap='Brak pomiaru'}
    else if(T.lower){if(cur<=target){f=1;gap='Zaliczone'}else{f=clamp((from-cur)/(from-target),0,.99);gap='jeszcze '+nf(cur-target)+' '+T.u}}
    else{if(cur>=target){f=1;gap='Zaliczone'}else{f=clamp((cur-from)/(target-from),0,.99);gap='jeszcze +'+nf(target-cur)+' '+T.u}}
    return {tid,name:T.n,cur,target,unit:T.u,f,gap,est:m&&m.est};
  });
  const done=S.log.filter(l=>TRAIN_KINDS.includes(l.kind)&&l.d>=S.levelSince).length;
  items.push({tid:'_s',name:'Treningi w tej klasie',cur:done,target:L.sessions,unit:'',f:clamp(done/L.sessions),gap:done>=L.sessions?'Zaliczone':'jeszcze '+(L.sessions-done)});
  const ls=STEPS.filter(s=>s.lv===S.level);
  if(ls.length){const m=ls.filter(s=>S.steps[s.id]===2).length;
    items.push({tid:'_k',name:'Kroki Klasy '+RN[S.level]+', które umiesz',cur:m,target:ls.length,unit:'',f:clamp(m/ls.length),gap:m>=ls.length?'Zaliczone':'jeszcze '+(ls.length-m)})}
  const pct=items.reduce((a,b)=>a+b.f,0)/items.length;
  return {items,pct,ready:items.every(i=>i.f>=1)};
}
/* jedno kryterium kamienia milowego: postęp f jak w levelStatus, od T.floor albo od pierwszego prawdziwego wyniku, jeśli lepszy */
function critStatus(c,st){
  const T=T_BY[c.t];const m=latest(c.t,true,st);const cur=m?m.v:null;const lower=c.op==='lte';
  const first=hist(c.t,true,st)[0];let from=T.floor;
  if(first&&(lower?first.v<from:first.v>from))from=first.v;
  const ok=cur!=null&&(lower?cur<=c.v:cur>=c.v);
  let f=0,gap;
  if(cur==null)gap='Brak pomiaru';
  else if(ok){f=1;gap='Zaliczone'}
  else{const span=lower?from-c.v:c.v-from;f=span>0?clamp((lower?from-cur:cur-from)/span,0,.99):0;gap=lower?'jeszcze '+nf(Math.round((cur-c.v)*10)/10)+' '+T.u:'jeszcze +'+nf(Math.round((c.v-cur)*10)/10)+' '+T.u}
  return {t:c.t,op:c.op,v:c.v,name:T.n,unit:T.u,cur,d:m?m.d:null,ok,f,gap};
}
/* kamień spełniony teraz według prawdziwych pomiarów (st = stan, domyślnie S) */
function msMet(id,st){const M=MS_BY[id];return !!M&&M.crit.every(c=>critStatus(c,st).ok)}
/* odblokowany: zapisany w S.ms albo spełniony teraz */
const gateOpen=id=>!!(S.ms&&S.ms[id])||msMet(id);
/* ćwiczenia, które kamień odblokowuje w planie */
const msUnlocks=id=>{const M=MS_BY[id];if(!M)return [];return [...new Set(PROG[M.p].phases.flatMap(ph=>ph.items.filter(it=>it.gate===id).map(it=>it.e)))]};
/* drabinka kamieni planu: [{id,n,d,crit:[critStatus],f,done,at,next,unlocks}] */
function msStatus(p){
  let nextSet=false;
  return (MILESTONES[p]||[]).map(M=>{
    const crit=M.crit.map(c=>critStatus(c));const at=(S.ms||{})[M.id]||null;const met=crit.every(c=>c.ok);
    const done=!!at||met;const f=done?1:crit.reduce((a,c)=>a+c.f,0)/crit.length;
    const next=!done&&!nextSet;if(next)nextSet=true;
    return {id:M.id,p,n:M.n,d:M.d,crit,f,done,at,next,unlocks:msUnlocks(M.id)};
  });
}
const nextMilestone=p=>msStatus(p).find(m=>m.next)||null;
/* nowo osiągnięte kamienie (zapisuje S.ms); B pokazuje świętowanie najwyższego na plan */
function checkMilestones(){
  const out=[];S.ms=S.ms||{};
  for(const p in MILESTONES)for(const M of MILESTONES[p])if(!S.ms[M.id]&&msMet(M.id)){S.ms[M.id]=today();out.push({p,id:M.id})}
  if(out.length)save();
  return out;
}
/* pomiary do zrobienia dla planów: plan w tygodniu lżejszym albo pomiar bez prawdziwego wyniku od 14+ dni.
   Pomiary ćwiczeń jeszcze nieodblokowanych są pomijane. Zwraca [{p, deload, due:[id testu]}] */
const TEST_GATE={dropback:'back_2',oversplit_r:'split_2',oversplit_l:'split_2'};
function testsDue(planIds,date){
  date=date||today();const out=[];
  for(const p of planIds||[]){if(!PROG[p])continue;
    const deload=progBlock(p,date).deload;
    const due=PROG[p].tests.filter(id=>{
      if(TEST_GATE[id]&&!gateOpen(TEST_GATE[id]))return false;
      if(deload)return true;
      const T=T_BY[id];const ids=T.of?T.of:[id];
      return ids.some(x=>{const h=rawHist(x,true);return !h.length||between(h[h.length-1].d,date)>=14});
    });
    if(due.length)out.push({p,deload,due});
  }
  return out;
}
function weekStreak(){
  const goal=S.days.length;if(!goal)return 0;
  const cnt=m=>S.log.filter(l=>TRAIN_KINDS.includes(l.kind)&&mondayOf(l.d)===m).length;
  let m=mondayOf(today());let n=cnt(m)>=goal?1:0;
  m=addDays(m,-7);let g=0;
  while(cnt(m)>=goal&&g++<300){n++;m=addDays(m,-7)}
  return n;
}

/* Sprawdza spójność danych i długości treningów; wynik w konsoli (console.assert + tabela). Zwraca liczbę błędów. */
function selfCheck(){
  let bad=0,warn=0;const ok=(c,msg)=>{if(!c)bad++;console.assert(c,msg)};
  const items=[];
  for(const p in PROG){const P0=PROG[p];
    ok(P0.phases.length===3,p+': 3 fazy');
    for(const t of P0.tests)ok(!!T_BY[t],p+': pomiar '+t+' istnieje');
    P0.phases.forEach((ph,i)=>ph.items.forEach(it=>{items.push([p,i,it]);if(it.alt)items.push([p,i,it.alt])}));
  }
  for(const [p,i,it] of items){
    ok(!!EX[it.e],p+' faza '+(i+1)+': ćwiczenie '+it.e+' istnieje');
    if(it.gate)ok(!!MS_BY[it.gate]&&MS_BY[it.gate].p===p,p+': bramka '+it.gate+' to kamień tego planu');
    ok(!!(it.t||it.r),p+': '+it.e+' ma czas albo powtórzenia');
  }
  for(const [id,e] of Object.entries(EX)){
    ok(!!CATS[e.c],id+': kategoria '+e.c);
    if(e.alt)ok(!!EX[e.alt]&&!EX[e.alt].pointe,id+': zamiennik '+e.alt+' istnieje i nie jest w pointach');
    if(e.fr)ok(!!phOf(e),id+': zapis wymowy dla „'+e.fr+'”');
  }
  for(const s of STEPS)ok(!!s.ph,'krok '+s.id+': zapis wymowy');
  for(const p in MILESTONES){ok(!!PROG[p],'kamienie: plan '+p);for(const M of MILESTONES[p])for(const c of M.crit)ok(!!T_BY[c.t]&&(c.op==='lte'||c.op==='gte'),M.id+': kryterium '+c.t)}
  for(const P0 of SIDE_PAIRS)for(const id of [P0.r,P0.l,P0.of].filter(Boolean))ok(!!T_BY[id],'para '+P0.n+': '+id);
  for(const L of [WARM,COOL,COOL_BACK,RECOVERY,...Object.values(QUICK).map(q=>q.items||[])])for(const it of L)ok(!!EX[it.e],'zestaw: '+it.e);
  const keys={ex:EX,plan:PROG,step:STEP_BY};
  for(const sc in VLINKS)for(const id in VLINKS[sc]){ok(!!(keys[sc]&&keys[sc][id]),'filmy: '+sc+'.'+id+' istnieje');
    for(const v of VLINKS[sc][id])ok(!!VSRC[v.src]&&/^https:\/\//.test(v.url)&&typeof v.min==='number'&&!!VLANG[v.lang]&&['tut','follow','class'].includes(v.kind),'film '+v.url)}
  /* długości treningów (cele z §1.3): zwykły 30–42, krótszy 24–32, tydzień lżejszy 22–32 min */
  const T0=['feet','pointe','turns'],F0=['split','middle','back'],rows=[];
  const lim={normal:[30,42],short:[24,32],lighter:[22,32]};
  for(const a of T0)for(const b of F0)for(let ph=0;ph<3;ph++){
    const r={plany:PROG[a].short+' + '+PROG[b].short,faza:ph+1};
    for(const [m,o] of [['normal',{}],['short',{short:true}],['lighter',{deload:true}]]){
      const c=composeSession([a,b],today(),Object.assign({ph,light:false},o));
      const min=planMin({kind:'session',blocks:c.blocks});r[m]=min;
      const msg=`${r.plany}, faza ${ph+1}, ${m}: ${min} min (cel ${lim[m][0]}–${lim[m][1]})`;
      /* twarda granica: żaden trening powyżej 45 min ani powyżej celu; poniżej celu to tylko ostrzeżenie (wynika z dawek planu i braku dodatkowych serii) */
      ok(min<=45&&min<=lim[m][1],msg);
      if(min<lim[m][0]){warn++;console.warn('Krótko: '+msg)}
    }
    rows.push(r);
  }
  if(console.table)console.table(rows);
  console.log((bad?'selfCheck: '+bad+' błędów':'selfCheck: wszystko w porządku')+(warn?' ('+warn+' ostrzeżeń o długości)':''));
  return bad;
}

function nudge(plan){
  const N=(txt,btns,cls)=>`<aside class="nudge ${cls||''}" aria-label="Podpowiedź"><p>${txt}</p><div class="row" style="gap:6px">${btns}</div></aside>`;
  if(!S.flags.v2intro)return N('<b>Arabeska ma nowe plany:</b> szpagaty, wygięcia, stopy, pointy i piruety. Pomiary i historia zostały bez zmian.','<button class="btn sm" data-act="v2plans">Zobacz plany</button><button class="btn ghost sm" data-act="v2ok">Rozumiem</button>');
  if(window.ARABESKA_AUTH&&ARABESKA_AUTH.ready&&!ARABESKA_AUTH.failed&&!ARABESKA_AUTH.user&&!S.flags.noLogin)return N('Zaloguj się kontem Google, żeby postępy zapisywały się na koncie.','<button class="btn sm" data-act="signIn">Zaloguj</button><button class="btn ghost sm" data-act="noLogin">Nie teraz</button>');
  const due=testsDue(plan.kind==='session'?plan.progs:S.active);
  if(due.length){const x=due.find(d=>d.deload)||due[0];
    return N(`<b>${x.deload?'Tydzień pomiarów':'Pora na pomiar'}: ${esc(PROG[x.p].n)}.</b> <span class="muted">Mierz po rozgrzewce, o tej samej porze, na tej samej podłodze i w tych samych butach.</span>`,`<button class="btn sm" data-act="measure" data-v="${testKey(x.due[0])}">Zmierz teraz</button>`)}
  const ls=levelStatus();
  if(!ls.max&&ls.ready)return N(`<b>Możesz przejść do Klasy ${RN[S.level+1]}.</b> Wszystkie wymagania są spełnione.`,'<button class="btn sm" data-go="postepy">Zobacz klasę</button>','good');
  for(const p of S.active){const m=nextMilestone(p);if(m&&m.f>=.8){const c=m.crit.find(c=>!c.ok);
    return N(`Do „${esc(m.n)}” brakuje: ${c?esc(c.name)+', '+esc(c.gap.replace(/^jeszcze /,'')):'niewiele'}.`,c?`<button class="btn sm" data-act="measure" data-v="${testKey(c.t)}">Zmierz</button>`:'','good')}}
  for(const p of S.active){if(!PROG[p]||!stalled(p))continue;const f=S.flags['stall_'+p];if(f&&between(f,today())<14)continue;const b=progBlock(p,today());
    return N(`<b>„${esc(PROG[p].n)}” stoi w miejscu.</b> Od ponad 3 tygodni pomiary tego planu się nie poprawiły. Nowy bodziec pomoże ruszyć dalej.`,
      `${b.ph<2&&!b.cycleDone?`<button class="btn sm" data-act="stallPhase" data-v="${p}">Przejdź do następnej fazy</button>`:`<button class="btn sm" data-act="stallCycle" data-v="${p}">Nowy cykl</button>`}<button class="btn ghost sm" data-act="stallLater" data-v="${p}">Nie teraz</button>`,'warn')}
  const A=activeCorr();if(A.length){const c=A[Math.floor(parse(today())/864e5/7)%A.length];
    return N(`<span class="eyebrow">Korekta tygodnia · ${esc(c.area)}</span><br><b>${esc(c.t)}</b>`,`<button class="btn sm" data-act="corrFix" data-v="${c.id}">Poprawione</button><button class="btn ghost sm" data-act="goCorr">Wszystkie (${A.length})</button>`)}
  return '';
}

/* ============ PLAN ============ */

    <div><button class="btn ghost sm" data-act="planOpen" data-v="${id}" aria-label="Szczegóły planu: ${esc(P0.n)}" style="padding-left:0">Szczegóły ›</button></div></article>`}

/* ============ POSTĘPY ============ */
function spark(h,lower){
  if(h.length<2)return '';
  const W=300,H=40,p=4;const vs=h.map(x=>x.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1}
  const pts=h.map((x,i)=>[p+i*(W-2*p)/(h.length-1),p+(H-2*p)*(lower?(x.v-mn)/(mx-mn):1-(x.v-mn)/(mx-mn))]);

}

/* plan stoi: trwa co najmniej 4 tygodnie, a żaden z jego pomiarów nie poprawił się względem prawdziwego wyniku sprzed 3+ tygodni */
function stalled(p){
  if(!PROG[p])return false;
  const st=S.progStart[p]||S.planStart;if(between(st,today())<28)return false;
  let checked=0;
  for(const tid of PROG[p].tests){
    const T=T_BY[tid];
    for(const id of T&&T.of?T.of:[tid]){
      const h=rawHist(id,true);if(h.length<2)continue;
      const last=h[h.length-1];const old=h.filter(m=>between(m.d,last.d)>=21);if(!old.length)continue;
      const ref=old[old.length-1];checked++;
      if(T_BY[id].lower?last.v<ref.v:last.v>ref.v)return false;
    }
  }
  return checked>0;
}

  const W=Math.max(280,Math.min(760,Math.round(inner-42))),H=W<420?190:210,L=30,B=24,T=12,bw=(W-L-8)/12;const y=v=>T+(H-T-B)*(1-v/top);
  let grid='';for(let v=0;v<=top;v+=step)grid+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`;
  const bars=weeks.map((w,i)=>{const x=L+i*bw+2,wd=bw-4,y0=y(0),y1=y(w.v),r=Math.min(4,(y0-y1)/2);
    const path=w.v?`<path d="M${x},${y0} L${x},${y1+r} Q${x},${y1} ${x+r},${y1} L${x+wd-r},${y1} Q${x+wd},${y1} ${x+wd},${y1+r} L${x+wd},${y0} Z" fill="var(--accent)"/>`:'';
    const lab=i%3===2||i===11?`<text x="${x+wd/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--muted)">${fmt(w.m,{day:'numeric',month:'numeric'})}</text>`:'';
    return `<g class="cbar"><title>Tydzień od ${fmt(w.m,{day:'numeric',month:'long'})}: ${w.v} min</title><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${path}${i===11&&w.v?`<text x="${x+wd/2}" y="${y1-5}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${w.v}</text>`:''}${lab}</g>`}).join('');
  const total=weeks.reduce((a,w)=>a+w.v,0);
  /* prawa vs lewa */
  const PAIRS=SIDE_PAIRS.map(p=>[p.n,p.r,p.l,T_BY[p.r].lower]);
  const rows=PAIRS.map(([n,a,b,lower])=>{const r=latest(a),l=latest(b);if(!r||!l)return '';const m=Math.max(r.v,l.v,1);const u=T_BY[a].u;
    const weak=r.v===l.v?'równo':(lower?(r.v>l.v?'prawa':'lewa'):(r.v<l.v?'prawa':'lewa'));
    const bar=(lab,v)=>`<div class="sbar"><span class="small muted">${lab}</span><div class="bar"><span style="width:${Math.max(2,v/m*100)}%"></span></div><span class="small num">${nf(v)} ${u}</span></div>`;
    return `<div class="srow"><div class="row between small"><b>${n}</b><span class="muted">${weak==='równo'?'równo':'słabsza: '+weak}${lower?' · mniej = lepiej':''}</span></div>${bar('P',r.v)}${bar('L',l.v)}</div>`}).join('');
  /* mapa umiejętności: postęp do następnej klasy w każdym obszarze */
  const st=levelStatus();let map='';
  if(!st.max){const g={};for(const it of st.items){const k=it.tid==='_s'?'Treningi':it.tid==='_k'?'Kroki':TGROUPS[T_BY[it.tid].g];(g[k]=g[k]||[]).push(it.f)}
    map=Object.entries(g).map(([k,a])=>{const p=Math.round(a.reduce((x,y)=>x+y,0)/a.length*100);return `<div class="sbar" style="grid-template-columns:130px 1fr 44px"><span class="small">${k}</span><div class="bar ${p>=100?'good':''}"><span style="width:${Math.max(2,p)}%"></span></div><span class="small num" style="text-align:right">${p}%</span></div>`}).join('')}
  return `<section class="stack"><h2>Wykresy</h2>
  <div class="card stack"><div class="row between"><h3>Minuty ćwiczeń w tygodniu</h3><span class="small muted num">${total} min w 12 tygodni</span></div>
    ${total?`<div><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Minuty ćwiczeń w ostatnich 12 tygodniach">${grid}${bars}</svg></div>
    <details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:700">Pokaż jako tabelę</summary><table class="ctable small num"><tr><th>Tydzień od</th><th>Minuty</th></tr>${weeks.map(w=>`<tr><td>${fmt(w.m,{day:'numeric',month:'short'})}</td><td>${w.v}</td></tr>`).join('')}</table></details>`:'<p class="small muted">Tu pojawią się minuty ćwiczeń z ostatnich 12 tygodni, gdy zapiszesz pierwszy trening.</p>'}</div>
  <div class="grid2">
    <div class="card stack"><h3>Prawa i lewa strona</h3>${rows||'<p class="small muted">Wpisz pomiary prawej i lewej strony (szpagaty, développé, pirouette), a zobaczysz tu porównanie.</p>'}</div>
    ${map?`<div class="card stack"><h3>Mapa umiejętności</h3><p class="small muted">Ile drogi do Klasy ${RN[S.level+1]} masz w każdym obszarze.</p>${map}</div>`:''}
  </div></section>`;
}

const POSES={split_r:'Szpagat prawy',split_l:'Szpagat lewy',oversplit_r:'Overspagat prawy',oversplit_l:'Overspagat lewy',split_side:'Szpagat poprzeczny',bridge:'Mostek',cambre:'Cambré',arabesque:'Arabeska',dev_side:'Développé w bok',dev_front:'Développé w przód',other:'Inne'};
let PDB=null,PH=null;
function pdb(){if(!PDB)PDB=new Promise((res,rej)=>{try{const r=indexedDB.open('arabeska-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return PDB}
async function ptx(mode,fn){const db=await pdb();return new Promise((res,rej)=>{const t=db.transaction('photos',mode);const st=t.objectStore('photos');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}
async function loadPhotos(){
  try{const all=await ptx('readonly',st=>st.getAll());(PH||[]).forEach(p=>URL.revokeObjectURL(p.url));
    PH=(all||[]).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id<b.id?-1:1).map(p=>({id:p.id,d:p.d,pose:p.pose,url:URL.createObjectURL(p.blob)}))}
  catch(e){PH=[];PH.failed=true}
  if(tab==='postepy'&&!P)render();
}
async function compressImg(file){
  const src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const sc=Math.min(1,1280/Math.max(src.naturalWidth,src.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(src.naturalWidth*sc);c.height=Math.round(src.naturalHeight*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);URL.revokeObjectURL(src.src);
  return new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.85));
}
async function addPhoto(file){
  try{const blob=await compressImg(file);await ptx('readwrite',st=>st.put({id:uid()+Date.now(),d:today(),pose:photoPose,blob}));toast('Zdjęcie zapisane');await loadPhotos()}
  catch(e){toast('Nie udało się zapisać zdjęcia')}
}
function photosSection(){
  if(!window.indexedDB)return '';
  if(PH===null){loadPhotos();return '<section class="sect"><h2>Zdjęcia postępu</h2><p class="small muted">Wczytywanie…</p></section>'}
  const list=PH.filter(p=>p.pose===photoPose);const first=list[0],last=list[list.length-1];
  return `<section class="sect"><div class="row between"><h2>Zdjęcia postępu</h2><label class="btn sm" style="cursor:pointer">+ Dodaj zdjęcie<input id="ph-file" type="file" accept="image/*" hidden></label></div>
    <p class="small muted">Rób zdjęcie tej samej pozycji raz w miesiącu, z tego samego miejsca. Zdjęcia zostają tylko na tym urządzeniu i nie trafiają do kopii zapasowej ani na konto.</p>
    <div class="chips" role="group" aria-label="Pozycja na zdjęciu">${Object.entries(POSES).map(([k,n])=>{const c=PH.filter(p=>p.pose===k).length;return `<button class="chip" data-act="photoPose" data-v="${k}" aria-pressed="${photoPose===k}">${n}${c?' <span class="num" style="opacity:.7">'+c+'</span>':''}</button>`}).join('')}</div>
    ${list.length>=2?`<div class="cmp"><figure><img src="${first.url}" alt="${esc(POSES[photoPose])}, ${first.d}"><figcaption class="small">Przed · ${fmt(first.d,{day:'numeric',month:'short',year:'numeric'})}</figcaption></figure><figure><img src="${last.url}" alt="${esc(POSES[photoPose])}, ${last.d}"><figcaption class="small">Teraz · ${fmt(last.d,{day:'numeric',month:'short',year:'numeric'})}</figcaption></figure></div><p class="small muted">Różnica: ${between(first.d,last.d)} dni.</p>`:''}
    ${list.length?`<div class="phgrid">${list.map(p=>`<button data-act="photoOpen" data-v="${p.id}" aria-label="Zdjęcie z ${p.d}"><img src="${p.url}" alt="" loading="lazy"><span class="small num">${fmt(p.d,{day:'numeric',month:'short'})}</span></button>`).join('')}</div>`:`<p class="small muted">Nie masz jeszcze zdjęć w kategorii „${POSES[photoPose]}”. Dodaj pierwsze, a za miesiąc porównasz je z nowym.</p>`}
  </section>`;
}

function toast(msg,err){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast'+(err?' err':'');t.setAttribute('aria-hidden','true');t.textContent=msg;document.body.appendChild(t);announce(msg);setTimeout(()=>t.remove(),err?4200:2400)}

    case 'planBack':planOpen=null;render();window.scrollTo(0,0);break;
    case 'phaseTab':planPh=Number(v);render();break;
    case 'nextPhase':confirmModal('Przejść do następnej fazy?',`„${esc(PROG[v].n)}” zacznie się od pierwszego tygodnia kolejnej fazy. Ćwiczenia będą trudniejsze.`,'Przejdź','doNextPhase:'+v);break;
    case 'newCycle':confirmModal('Zacząć nowy cykl?',`„${esc(PROG[v].n)}” wróci do tygodnia 1 i fazy 1. Pomiary i kamienie milowe zostają.`,'Zacznij od nowa','doNewCycle:'+v);break;
    case 'stallPhase':nextPhase(v);save();render();toast('Plan przeszedł do następnej fazy');break;
    case 'stallCycle':newCycle(v);save();render();toast('Nowy cykl od tygodnia 1');break;
    case 'stallLater':S.flags['stall_'+v]=today();save();render();break;
    case 'noDeload':S.flags.noDeload=today();save();render();break;
    case 'quick':startPlan(quickPlan(v));break;
    case 'levelUp':if(S.level<8){const from=S.level;S.level++;S.levelSince=today();save();render();levelUpMoment(from);announce('Witaj w Klasie '+RN[S.level])}break;
    case 'luClose':closeLevelUp();break;
    case 'luSteps':closeLevelUp();libSeg='kroki';stepLv=S.level;go('biblioteka');break;
    case 'msNext':closeLevelUp();showNextMs();break;
    case 'msToggle':if(msOpen.has(v))msOpen.delete(v);else msOpen.add(v);render();document.querySelector(`[data-act="msToggle"][data-v="${v}"]`)?.focus({preventScroll:true});break;
    case 'otherAll':otherAll=!otherAll;tgState.other=true;render();break;
    case 'saveSettings':{S.name=document.getElementById('set-name').value.trim().slice(0,30);const lv=Number(document.getElementById('set-level').value);if(lv!==S.level){S.level=lv;S.levelSince=today()}save();render();toast('Zapisano');break}
    case 'back':go(backTab||'dzis');break;
    case 'reset':modal(`<h2 class="t3">Wyczyścić wszystkie dane?</h2><p class="small muted">Usuniesz historię treningów, pomiary i ustawienia. Tego nie da się cofnąć. Jeśli możesz, najpierw zrób kopię.</p><div class="row end"><button class="btn" data-act="closeModal">Anuluj</button><button class="btn" data-act="export">Najpierw eksportuj</button><button class="btn danger" data-act="doReset">Wyczyść</button></div>`);break;
    case 'doReset':S=defaults();S.updatedAt=Date.now();save();closeModal();render();toast('Dane wyczyszczone');break;
    case 'openTest':{openTest=v;render();const P=PAIR_OF[v];const i=document.getElementById('tv-'+(P?P.r:v));if(i){i.focus({preventScroll:true});i.scrollIntoView({block:'center',behavior:'smooth'})}break}
    case 'measure':measure(v);break;
    case 'addTest':{const r=readTest(v);if(r===false)break;if(r==null){fieldErr(document.getElementById('tv-'+v),'Wpisz wynik');break}
      const wr=levelStatus().ready;addMeasure(v,r,document.getElementById('td-'+v).value);openTest=null;save();render();afterMeasure(wr,'Pomiar zapisany');break}
    case 'addPair':{const P=PAIR_OF[v];const r=readTest(P.r);if(r===false)break;const l=readTest(P.l);if(l===false)break;
      if(r==null&&l==null){fieldErr(document.getElementById('tv-'+P.r),'Wpisz wynik przynajmniej dla jednej strony');break}
      const wr=levelStatus().ready;const d=document.getElementById('td-'+v).value;if(r!=null)addMeasure(P.r,r,d);if(l!=null)addMeasure(P.l,l,d);
      if(P.of)S.tests[P.of]=(S.tests[P.of]||[]).filter(m=>!m.est);
      openTest=null;save();render();document.getElementById('tc-'+v)?.querySelector('[data-act="openTest"]')?.focus({preventScroll:true});afterMeasure(wr,r!=null&&l!=null?'Zapisano obie strony':'Pomiar zapisany');break}
    case 'delTest':{const i=Number(a.dataset.i);const m=(S.tests[v]||[])[i];if(!m)break;pendingTest={id:v,i,d:m.d,v:m.v};
      confirmModal('Usunąć pomiar?',`${T_BY[v].n}: ${nf(m.v)} ${T_BY[v].u}, ${fmt(m.d,{day:'numeric',month:'long',year:'numeric'})}.`,'Usuń','doDelTest');break}
    case 'doDelTest':{const q=pendingTest;pendingTest=null;if(!q){closeModal();break}const L=S.tests[q.id]||[];const i=L[q.i]&&L[q.i].d===q.d&&L[q.i].v===q.v?q.i:L.findIndex(m=>m.d===q.d&&m.v===q.v);
      if(i>=0){L.splice(i,1);S.tests[q.id]=L;save()}closeModal();render();toast('Pomiar usunięty');break}
    case 'delLog':pendingDel=v;confirmModal('Usunąć wpis?','Wpis zniknie z historii i z licznika treningów.','Usuń','doDel');break;
    case 'doDel':S.log=S.log.filter(l=>l.id!==pendingDel);pendingDel=null;save();closeModal();render();break;
    case 'export':{const json=JSON.stringify(S);
      modal(`<h2 class="t3">Eksport danych</h2><p class="small muted">Skopiuj ten tekst albo pobierz plik. W drugiej wersji aplikacji wybierz „Importuj dane”.</p>
      <textarea class="input" id="exp-txt" rows="5" readonly>${esc(json)}</textarea>
      <div class="row end"><button class="btn" data-act="closeModal">Zamknij</button>${window.claude?'':'<button class="btn" data-act="expFile">Pobierz plik</button>'}<button class="btn primary" data-act="expCopy">Kopiuj</button></div>`);break}
    case 'expCopy':{const ta=document.getElementById('exp-txt');
      navigator.clipboard.writeText(ta.value).then(()=>toast('Skopiowano')).catch(()=>{ta.focus();ta.select();toast('Zaznaczone, skopiuj ręcznie')});break}
    case 'expFile':{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download='arabeska-kopia-'+today()+'.json';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
    case 'import':modal(`<h2 class="t3">Import danych</h2><p class="small muted">Wklej skopiowany tekst albo wybierz plik kopii. Obecne dane w tej wersji zostaną zastąpione.</p>
      <textarea class="input" id="imp-txt" rows="5" placeholder="Wklej tutaj dane"></textarea>
      <label class="field">albo plik<input id="imp-file" type="file" accept=".json,application/json"></label>
      <div class="row end"><button class="btn" data-act="closeModal">Anuluj</button><button class="btn primary" data-act="doImport">Wczytaj</button></div>`);break;
    case 'backups':{const b=loadBackups();modal(`<h2 class="t3">Poprzednie wersje</h2><p class="small muted">Aplikacja zapamiętuje dane sprzed synchronizacji z kontem. Przywrócenie połączy wybraną wersję z obecnymi danymi, więc nic nie zginie.</p>
      <div class="stack">${b.map((x,i)=>`<div class="row" style="justify-content:space-between;gap:8px"><div><b>${new Date(x.at).toLocaleString('pl-PL',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</b><p class="small muted">${esc(x.why)} · treningi: ${(x.data.log||[]).filter(l=>TRAIN_KINDS.includes(l.kind)).length}</p></div><button class="btn sm" data-act="restoreBackup" data-i="${i}">Przywróć</button></div>`).join('')}</div>
      <div class="row end"><button class="btn" data-act="closeModal">Zamknij</button></div>`);break}
    case 'restoreBackup':{const x=loadBackups()[+a.dataset.i];if(!x)break;backup(S,'Dane przed przywróceniem poprzedniej wersji');S=mergeStates(x.data,S);save();closeModal();render();toast('Przywrócono poprzednią wersję');break}
    case 'doImport':{const f=document.getElementById('imp-file').files[0];
      const apply=txt=>{try{const o=JSON.parse(txt);if(!o||typeof o!=='object'||!o.tests||!Array.isArray(o.log))throw 0;S=migrate(o);save();closeModal();render();toast('Dane wczytane')}catch(_){toast('To nie wygląda na kopię z Arabeski')}};
      if(f){f.text().then(apply)}else apply(document.getElementById('imp-txt').value.trim());break}
    case 'signIn':ARABESKA_AUTH.signIn().catch(err=>{if(err&&err.code!=='auth/popup-closed-by-user'&&err.code!=='auth/cancelled-popup-request')toast('Nie udało się zalogować: '+((err&&err.code)||'błąd'))});break;
    case 'signOut':ARABESKA_AUTH.signOut().then(()=>toast('Wylogowano. Dane zostają w tym telefonie.'));break;
    case 'noLogin':S.flags.noLogin=1;saveLocal();render();break;
    case 'mode':S.mode=v;save();render();break;
    case 'ytSwap':{const x=(planFor(today()).vids||[]).concat(planFor(calSel).vids||[]).find(q=>q.key===a.dataset.key);if(!x)break;S.ytPick[a.dataset.key]=(Number(a.dataset.n)+1)%x.list.length;
      const keep=Object.keys(S.ytPick).sort().slice(-60);S.ytPick=Object.fromEntries(keep.map(k=>[k,S.ytPick[k]]));save();render();break}
    case 'ytDone':{const p=planFor(a.dataset.date);const min=p.vids.reduce((s,x)=>s+x.v.min,0)+5;
      S.log.push({id:uid(),d:a.dataset.date,kind:'session',title:p.title+' (z filmem)',progs:p.progs,min,rpe:null,note:p.vids.map(x=>x.v.title).join(' + ').slice(0,200)});save();render();toast('Trening zapisany');celebrate();break}
    case 'filmsToday':filmsSheet(a.dataset.date);break;
    case 'stepSet':{const s=Number(a.dataset.s);if(s)S.steps[v]=s;else delete S.steps[v];save();
      if(document.getElementById('mlayer').contains(a))reopenSheet();else{render();const d=document.querySelector(`details[data-step="${v}"]`);if(d)d.open=true;document.querySelector(`[data-act="stepSet"][data-v="${v}"][data-s="${s}"]`)?.focus({preventScroll:true})}
      if(s===2)toast('Brawo! Umiesz już: '+STEP_BY[v].n);break}
    case 'goSteps':libSeg='kroki';stepLv=null;go('biblioteka');break;
    case 'stepLv':stepLv=Number(v);render();break;
    case 'libSeg':libSeg=v;render();break;
    case 'saveHip':{const rd=id=>{const x=document.getElementById(id).value.trim().replace(',','.');return x===''?null:parseFloat(x)};
      const h=rd('hip-cm'),f=rd('foot-cm');
      if(h!=null&&(isNaN(h)||h<40||h>130)){fieldErr(document.getElementById('hip-cm'),'Wpisz wysokość biodra w cm, np. 92');break}
      if(f!=null&&(isNaN(f)||f<12||f>35)){fieldErr(document.getElementById('foot-cm'),'Wpisz długość stopy w cm, np. 24');break}
      S.hipCm=h;S.footCm=f;save();render();toast('Zapisano');break}
    case 'cat':libCat=v;render();break;
    case 'openEx':exSheet(v);break;
    case 'pFilm':exSheet(v);break;
    case 'principles':principlesSheet();break;
    case 'vMore':vMoreOpen.add(v);if(document.getElementById('mlayer').contains(a))reopenSheet();else render();break;
    case 'sayFr':speak(a.dataset.t,'fr-FR');break;
    case 'saveVid':{const inp=document.getElementById('vid-'+v);const val=inp.value.trim();if(val&&!/^https?:\/\//i.test(val)){fieldErr(inp,'Link musi zaczynać się od https://');break}
      if(val)S.videos[v]=val;else delete S.videos[v];save();reopenSheet();toast(val?'Wideo zapisane':'Link usunięty');break}
    case 'addCorr':{const t=document.getElementById('corr-t').value.trim();if(!t){fieldErr(document.getElementById('corr-t'),'Wpisz treść korekty');break}
      S.corrections.push({id:uid(),t:t.slice(0,200),area:document.getElementById('corr-area').value,d:today(),fixed:null});save();render();toast('Korekta dodana');break}
    case 'corrFix':{const c=findC(v);if(c){c.fixed=today();save();render();toast('Brawo! Korekta poprawiona')}break}
    case 'corrUnfix':{const c=findC(v);if(c){c.fixed=null;save();render()}break}
    case 'corrDel':S.corrections=S.corrections.filter(c=>c.id!==v);save();render();break;
    case 'goCorr':go('postepy');document.getElementById('korekty')?.scrollIntoView({block:'start'});break;
    case 'photoPose':photoPose=v;render();break;
    case 'photoOpen':{const p=(PH||[]).find(x=>x.id===v);if(p)modal(`<img src="${p.url}" alt="" style="border-radius:12px;width:100%"><p class="small muted">${esc(POSES[p.pose]||p.pose)} · ${fmt(p.d,{day:'numeric',month:'long',year:'numeric'})}</p><div class="row end"><button class="btn ghost" data-act="photoDelete" data-v="${p.id}">Usuń zdjęcie</button><button class="btn primary" data-act="closeModal">Zamknij</button></div>`);break}
    case 'photoDelete':ptx('readwrite',st=>st.delete(v)).then(()=>{closeModal();loadPhotos();toast('Zdjęcie usunięte')}).catch(()=>toast('Nie udało się usunąć'));break;
    case 'varLv':varLv=Number(v);render();break;
    case 'varSet':{S.vars=Object.assign({},S.vars);const s=Number(a.dataset.s);if(s)S.vars[v]=s;else delete S.vars[v];save();render();const d=document.querySelector(`details[data-var="${v}"]`);if(d)d.open=true;break}
    case 'openStep':openStepInLib(v);break;
    case 'pNext':nextStep();break;
    case 'pPrev':prevStep();break;
    case 'pToggle':P.running=!P.running;P.last=performance.now();drawPlayer();break;
    case 'pSound':P.sound=!P.sound;drawPlayer();break;
    case 'pClose':askQuit();break;
    case 'pResume':resumeP();break;
    case 'pQuit':endPlayer();break;
    case 'pPartial':saveSession(true);celebrate();break;
    case 'rpe':P.rpe=Number(v);document.querySelectorAll('.rpe button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));break;
    case 'pSave':saveSession(false);celebrate();break;
    default:
      if(act.startsWith('doNextPhase:')){const p=act.slice(12);nextPhase(p);save();closeModal();planPh=null;render();toast('Plan przeszedł do następnej fazy')}
      else if(act.startsWith('doNewCycle:')){const p=act.slice(11);newCycle(p);save();closeModal();planPh=null;render();toast('Nowy cykl od tygodnia 1')}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='ph-file'&&e.target.files[0])addPhoto(e.target.files[0])});
let libT=null;
document.addEventListener('input',e=>{
  const x=e.target;if(x.getAttribute&&x.getAttribute('aria-invalid')){x.removeAttribute('aria-invalid');x.removeAttribute('aria-describedby');document.getElementById('fe-'+x.id)?.remove();
    const pf=x.closest('.pairform');if(pf)pf.querySelectorAll('[aria-invalid]').forEach(y=>{y.removeAttribute('aria-invalid');document.getElementById('fe-'+y.id)?.remove()})}
  if(x.id==='lib-q'){libQ=x.value;clearTimeout(libT);libT=setTimeout(()=>{const L=document.getElementById('lib-list');if(L)L.innerHTML=libList()},150)}
});
/* okna: Esc zamyka, Tab nie wychodzi poza okno */
document.addEventListener('keydown',e=>{
  const top=[...document.querySelectorAll('#layer [role="dialog"],#mlayer [role="dialog"]')].pop();if(!top)return;
  if(e.key==='Escape'){e.preventDefault();
    if(document.getElementById('pconfirm'))resumeP();
    else if(top.classList.contains('levelup')){closeLevelUp();if(top.classList.contains('ms'))showNextMs()}
    else if(top.classList.contains('overlay')){if(P&&P.phase!=='done')askQuit()}
    else closeModal();return}
  if(e.key!=='Tab')return;
  const f=[...top.querySelectorAll('a[href]:not([tabindex="-1"]),button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.getClientRects().length);if(!f.length)return;
  const a=f[0],z=f[f.length-1];
  if(!top.contains(document.activeElement)){e.preventDefault();a.focus()}
  else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.id==='more')moreOpen=d.open;else if(d.classList&&d.classList.contains('tgroup')&&d.dataset.g)tgState[d.dataset.g]=d.open},true);
let rzW=innerWidth,rzT=null;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(Math.abs(innerWidth-rzW)>40&&tab==='postepy'&&!P){rzW=innerWidth;render()}},250)});
document.addEventListener('keydown',e=>{
  if(!P||P.phase==='done'||document.getElementById('pconfirm')||document.querySelector('#mlayer [role="dialog"]'))return;
  if(e.key===' '&&P.phase!=='reps'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'){e.preventDefault();P.running=!P.running;P.last=performance.now();drawPlayer()}
  if(e.key==='ArrowRight')nextStep();if(e.key==='ArrowLeft')prevStep();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const f=e.target.closest&&e.target.closest('.addform');if(!f)return;
  e.preventDefault();const b=f.querySelector('.btn.primary');b&&b.click();
});
document.addEventListener('visibilitychange',()=>{if(P&&document.visibilityState==='visible'&&!wake)lockScreen()});
window.addEventListener('hashchange',()=>{const h=route(location.hash.slice(1));if(h&&h!==tab){if(h==='ustawienia'&&tab!=='ustawienia')backTab=tab;tab=h;render();window.scrollTo(0,0)}});

render();
initCloud();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
<script>
/* Przycisk instalacji: pasek na górze strony, gdy Chrome pozwala zainstalować aplikację. */
(function(){
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone)return;
  var bar=null,evt=null;
  function hide(){if(bar){bar.remove();bar=null}}
  function show(){
    if(bar)return;
    bar=document.createElement('div');
    bar.setAttribute('role','region');bar.setAttribute('aria-label','Instalacja aplikacji');
    bar.style.cssText='display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));background:#9E2B4E;color:#fff;font:15px/1.4 system-ui,sans-serif';
    var txt=document.createElement('span');txt.style.flex='1';txt.textContent='Zainstaluj Arabeskę: ikona na ekranie i działanie offline.';
    var b=document.createElement('button');b.type='button';b.textContent='Zainstaluj';
    b.style.cssText='font:inherit;font-weight:600;border:0;border-radius:8px;padding:7px 14px;background:#fff;color:#9E2B4E;cursor:pointer';
    var x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Zamknij');
    x.style.cssText='font:20px/1 system-ui;border:0;background:none;color:#fff;cursor:pointer;padding:4px 6px';
    b.onclick=function(){if(!evt)return;var e=evt;evt=null;e.prompt();e.userChoice.finally(hide)};
    x.onclick=hide;
    bar.append(txt,b,x);document.body.prepend(bar);
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;show()});
  window.addEventListener('appinstalled',hide);
})();
</script>
