<style>
/* Sala baletowa o poranku: ciepły papier i atrament, jeden burgundowy akcent do działania, spokojne kolory obszarów jako drogowskazy.
   Karta treningu to scena, reszta to notatki na marginesie: mniej pudełek, więcej linii i oddechu. */
:root{
  --bg:#F7F4EF; --surface:#FFFFFF; --surface-2:#EFEAE3; --ink:#1F1A1C; --muted:#665C61;
  --line:#E3DCD3; --line-strong:#8A8085;
  --accent:#9E2B4E; --accent-ink:#FFFFFF; --accent-soft:#F6E3E9;
  --good:#23674A; --good-soft:#DDEFE5; --warn:#875A10; --warn-soft:#F8EBD3;
  --a-split:#B23F66; --a-middle:#A2542A; --a-back:#6A4C9C; --a-feet:#2B7774; --a-pointe:#94690F; --a-turns:#2D5D9B;
  --a-split-soft:#F7E2E9; --a-middle-soft:#F6E6DC; --a-back-soft:#ECE5F6; --a-feet-soft:#DFF0EF; --a-pointe-soft:#F5ECD6; --a-turns-soft:#E1EAF6;
  --shadow:0 1px 2px rgba(31,26,28,.05),0 8px 24px rgba(31,26,28,.06);
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:22px; --fs-2xl:clamp(26px,6vw,32px); --fs-3xl:clamp(30px,6vw,40px);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-sm:8px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --area:var(--accent); --area-soft:var(--accent-soft);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141113; --surface:#1E1A1D; --surface-2:#2A2428; --ink:#F2EDEF; --muted:#ADA3A8;
  --line:#372F34; --line-strong:#7B7076;
  --accent:#E8879F; --accent-ink:#1C0D13; --accent-soft:#3F2430;
  --good:#74C9A0; --good-soft:#1B3328; --warn:#E7B866; --warn-soft:#3B2E17;
  --a-split:#EC8FAB; --a-middle:#E59D72; --a-back:#B6A0EA; --a-feet:#6FC8C3; --a-pointe:#E2BA5E; --a-turns:#8DB3EC;
  --a-split-soft:#3A2129; --a-middle-soft:#3A2A20; --a-back-soft:#2C2540; --a-feet-soft:#1C3533; --a-pointe-soft:#372D17; --a-turns-soft:#1F2B3D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1E1A1D; --surface-2:#2A2428; --ink:#F2EDEF; --muted:#ADA3A8;
  --line:#372F34; --line-strong:#7B7076;
  --accent:#E8879F; --accent-ink:#1C0D13; --accent-soft:#3F2430;
  --good:#74C9A0; --good-soft:#1B3328; --warn:#E7B866; --warn-soft:#3B2E17;
  --a-split:#EC8FAB; --a-middle:#E59D72; --a-back:#B6A0EA; --a-feet:#6FC8C3; --a-pointe:#E2BA5E; --a-turns:#8DB3EC;
  --a-split-soft:#3A2129; --a-middle-soft:#3A2A20; --a-back-soft:#2C2540; --a-feet-soft:#1C3533; --a-pointe-soft:#372D17; --a-turns-soft:#1F2B3D;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
[data-area="split"]{--area:var(--a-split);--area-soft:var(--a-split-soft)}
[data-area="middle"]{--area:var(--a-middle);--area-soft:var(--a-middle-soft)}
[data-area="back"]{--area:var(--a-back);--area-soft:var(--a-back-soft)}
[data-area="feet"]{--area:var(--a-feet);--area-soft:var(--a-feet-soft)}
[data-area="pointe"]{--area:var(--a-pointe);--area-soft:var(--a-pointe-soft)}
[data-area="turns"]{--area:var(--a-turns);--area-soft:var(--a-turns-soft)}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--fs-md);line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{line-height:1.15;margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:500;font-size:var(--fs-3xl)}
h2{font-family:var(--body);font-weight:800;font-size:var(--fs-xl);letter-spacing:-.01em}
h3{font-family:var(--body);font-weight:700;font-size:var(--fs-lg)}
h2.t3{font-size:var(--fs-lg)}
.t4{font-family:var(--body);font-size:var(--fs-sm);font-weight:800;margin:0}
p{margin:0;max-width:68ch}
.hero p,.levelup p,.modal p,.pl p{max-width:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft);color:var(--ink)}
input,textarea{caret-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
::placeholder{color:var(--muted);opacity:1}
html{scrollbar-color:var(--line-strong) transparent}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
.fr{font-family:var(--display);font-style:italic;color:var(--muted)}
.ph{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}

/* shell */
.app{min-height:100%;display:flex;flex-direction:column}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.nav .brand,.nav .navfoot{display:none}
.nav .tabs{display:flex;justify-content:space-around}
.nav .tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:9px 2px 8px;min-height:56px;color:var(--muted);font-size:12px;font-weight:700}
.nav .tabs button svg{width:22px;height:22px}
.nav .tabs button[aria-current="page"]{color:var(--accent)}
.nav .tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) 112px;display:flex;flex-direction:column;gap:var(--s5)}
@media (min-width:900px){
  .app{flex-direction:row}
  .nav{position:sticky;top:0;bottom:auto;height:100vh;width:236px;flex:none;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:28px 14px 20px}
  .nav .brand{display:block;font-family:var(--display);font-style:italic;font-size:30px;padding:0 12px 24px;color:var(--ink)}
  .nav .brand small{display:block;font-family:var(--body);font-style:normal;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-top:2px}
  .nav .tabs{flex-direction:column;gap:4px}
  .nav .tabs button,.navset{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;min-height:44px;justify-content:flex-start;border-radius:10px}
  .nav .tabs button[aria-current="page"],.navset[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .nav .tabs button[aria-current="page"]::before{display:none}
  .nav .navfoot{display:flex;flex-direction:column;gap:10px;margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
  .navset{display:flex;align-items:center;background:none;border:0;color:var(--muted);font-weight:700}
  .navset svg{width:20px;height:20px}
  .nav .sync{padding:0 12px}
  main{padding-block:40px 64px;gap:var(--s6)}
  .phead .iconbtn.gear{display:none}
}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.cloud i{background:var(--good)}
.sync.mob{width:28px;height:44px;justify-content:center}
@media (min-width:900px){.sync.mob{display:none}}

/* nagłówek ekranu */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.phead-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.phead-a{display:flex;align-items:center;gap:2px;flex:none;margin-top:-4px}
.back{padding-left:0!important}

/* elementy */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5) 20px;min-width:0}
.sect{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.sect+.sect,.sect.rule{border-top:1px solid var(--line);padding-top:var(--s5)}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.row.end{justify-content:flex-end}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--s4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700;font-size:var(--fs-sm);text-decoration:none;color:var(--ink);transition:border-color .16s var(--ease),background .16s var(--ease)}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{min-height:56px;padding:14px 26px;font-size:var(--fs-md);border-radius:16px}
.btn.big svg{width:20px;height:20px}
.btn.wide{width:100%}
@media (min-width:600px){.btn.wide{width:auto;min-width:240px}}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:8px 10px}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--warn);border-color:var(--warn)}
@media (pointer:coarse){.btn.sm,.btn.ghost,.chip,.status button,.seg button,.say,.vlink,.exname,.mshead{min-height:44px}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.achip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--area-soft);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}
.achip>i,.adot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--area);flex:none}
.achip.sm{font-size:12px;padding:2px 8px 2px 7px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--area);border-radius:99px;transition:width .5s var(--ease)}
.bar.good>span{background:var(--good)}
a{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.input{border:1px solid var(--line-strong);background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-md);min-width:0;width:100%;min-height:44px}
textarea{resize:vertical}
[aria-invalid="true"]{border-color:var(--warn)!important;box-shadow:0 0 0 1px var(--warn)}
.ferr{font-size:12px;font-weight:700;color:var(--warn);margin:0}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-sm);font-weight:600;background:var(--surface-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note>span{flex:1;min-width:180px}
ul.cues{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.switch{position:relative;width:48px;height:28px;flex:none;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-strong);padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s var(--ease),background .2s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent)}
@media (pointer:coarse){.switch{outline:8px solid transparent;outline-offset:0}}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:var(--s4)}
.setrow>div{min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.wide{display:flex}.seg.wide button{flex:1}
.chips{position:relative;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips.ovf{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.chips.ovf.st{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.chips.ovf.st.en{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.chips.ovf.en:not(.st){-webkit-mask-image:none;mask-image:none}
.chips .chip{flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.chev::after,details.more>summary::after,details.sub>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .2s var(--ease)}
details[open]>summary.chev::after,details.more[open]>summary::after,details.sub[open]>summary::after{transform:rotate(-135deg) translateY(-3px)}
details.more{border-top:1px solid var(--line)}
details.more>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-weight:700;min-height:44px}
details.more .inner{padding:0 0 var(--s4)}
details.sub>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-weight:700;font-size:var(--fs-sm);color:var(--accent);min-height:44px}
details.sub{border-top:1px solid var(--line)}

/* wymowa i ćwiczenia */
.say{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);padding:0;flex:none;vertical-align:middle}
.say::before{content:"";position:absolute;inset:-8px}
.say svg{width:16px;height:16px}
.say.lg{width:44px;height:44px}.say.lg svg{width:22px;height:22px}
.frl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.exlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exl{display:flex;flex-direction:column;gap:2px;min-width:0}
.exname{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:var(--fs-md);color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;text-decoration-thickness:1px}
.exname:hover{text-decoration-color:var(--accent)}
.exname svg{width:15px;height:15px;color:var(--muted);flex:none}
.exrow.locked .exname{color:var(--muted)}
.dose{font-size:var(--fs-sm);color:var(--muted);white-space:nowrap;text-align:right;padding-top:2px}
.librows{margin:0;padding:0;list-style:none}
.librow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n s" "p p";gap:6px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.librow:first-child{border-top:0}
.librow .exname{grid-area:n;flex-direction:column;align-items:flex-start;gap:0;text-decoration:none}
.librow .exname b{font-weight:700}
.librow .say{grid-area:s}
.librow .lp{grid-area:p;display:flex;gap:6px;flex-wrap:wrap}

/* filmy: tylko linki, zawsze w nowej karcie */
.vlist{display:flex;flex-direction:column;gap:2px}
.vlink{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.vlist>.vlink:first-child{border-top:0}
.vlink:hover b{color:var(--accent)}
.vb{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.vb.dmc{background:var(--accent-soft);color:var(--accent)}
.vt{display:flex;flex-direction:column;gap:2px;min-width:0}
.vt b{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vt .vn{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.vlink>svg{width:16px;height:16px;color:var(--muted)}
.vrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}

/* Dziś: karta treningu */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:calc(var(--s4) + 6px) 18px var(--s4);display:flex;flex-direction:column;gap:var(--s3);overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--a1,var(--accent)),var(--a2,var(--accent)))}
.hero-top{display:flex;flex-direction:column;gap:6px}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.htitle{font-family:var(--display);font-weight:500;font-size:var(--fs-2xl);line-height:1.15;letter-spacing:0}
h3.htitle{font-size:24px}
.meta{font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.cue{font-style:italic;font-size:15px;color:var(--ink);border-left:2px solid var(--a1,var(--accent));padding-left:10px}
.blocks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.blocks>details{border-bottom:1px solid var(--line)}
.blocks summary{display:flex;align-items:center;gap:12px;padding:8px 0;min-height:44px}
.blocks summary .bm{margin-left:auto}
.blocks summary .bl{display:flex;align-items:center;gap:8px;min-width:0}
.blocks summary .bl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.blocks summary .bl .small{flex:none}
.blocks summary .bm{display:flex;align-items:center;gap:10px;white-space:nowrap}
.blocks .exlist{padding:0 0 8px}
.actions{display:flex;flex-direction:column;gap:var(--s3);align-items:stretch}
@media (min-width:600px){.actions{flex-direction:row;align-items:center;flex-wrap:wrap}}
.actions .sec{gap:8px}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 0 0;min-height:44px;font-weight:700;font-size:var(--fs-sm);color:var(--accent);text-align:left}
.linkrow svg{width:16px;height:16px}
.nudge{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--r);background:var(--surface-2);border-left:3px solid var(--accent)}
.nudge.warn{border-left-color:var(--warn)}
.nudge.good{border-left-color:var(--good)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;min-height:44px;border-radius:10px;font-size:12px;color:var(--muted);font-weight:700;background:none;border:0}
.week .d.today{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong)}
.dot.plan{border-color:var(--accent)}
.dot.done{background:var(--accent);border-color:var(--accent)}
.dot.class{background:var(--ink);border-color:var(--ink)}
.dot.rec{border-color:var(--good);background:var(--good-soft)}
.dot.miss{border-color:var(--muted);border-style:dashed}
.legend{gap:6px 14px}.legend>span{display:inline-flex;align-items:center;gap:6px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.quick .btn{justify-content:space-between;text-align:left}
.tip{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.45}

/* Plan */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cal button{aspect-ratio:1;max-width:100%;min-width:0;border:1px solid transparent;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:600;padding:0}
.cal button.out{color:var(--muted)}
.cal button.out .dots{opacity:.5}
.cal button.today .num{color:var(--accent);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cal button.sel{background:var(--accent-soft);border-color:var(--accent)}
.cal button .dots{display:flex;gap:3px;height:8px}
.cal button .dot{width:8px;height:8px;border-width:1.5px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s4)}
.pcard{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);border-top:3px solid var(--area)}
.pcard.off{border-top-color:var(--line);background:none}
.pcard.off .wtrack{opacity:.5}
.pname{display:flex;align-items:center;gap:8px;font-size:var(--fs-lg)}
.wtrack{display:flex;gap:6px}
.wtrack .wg{flex:1;display:flex;gap:2px}
.wtrack i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.wtrack i.light{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.wtrack i.done{background:var(--line-strong);box-shadow:none}
.wtrack i.cur{background:var(--area);box-shadow:none}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .bar{height:6px}
.pd-head{display:flex;flex-direction:column;gap:10px}
.pd-head h1{font-size:var(--fs-3xl)}
.msl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.msl>li{display:grid;grid-template-columns:30px 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.msl>li:first-child{border-top:0}
.msl .mc{grid-row:1/span 2}
.msl .mt{display:flex;flex-direction:column;gap:4px;min-width:0}
.msname{font-family:var(--display);font-style:italic;font-weight:500;font-size:20px;line-height:1.2}
.crit{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:var(--fs-sm)}
.crit .bar{grid-column:1/-1;height:6px}

/* drabinka kamieni milowych */
.ladder4{display:flex;align-items:flex-start;gap:0}
.ladder4 .st{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:34px}
.ladder4 .st+.st::before{content:"";position:absolute;top:10px;right:calc(50% + 11px);width:12px;height:2px;background:var(--line)}
.ladder4 .st.done+.st::before{background:var(--area)}
.mc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;color:var(--surface);flex:none}
.mc svg{width:13px;height:13px}
.done>.mc,.mc.done{background:var(--area);border-color:var(--area)}
.next>.mc,.mc.next{border:3px solid var(--area)}
.ladder4 .pct{font-size:11px;font-weight:700;color:var(--ink)}
.msrows{display:flex;flex-direction:column}
.msrow{border-top:1px solid var(--line)}
.msrow:first-child{border-top:0}
.mshead{display:grid;grid-template-columns:1fr auto;grid-template-areas:"n l" "x x";gap:6px 12px;align-items:center;width:100%;background:none;border:0;padding:14px 0;text-align:left}
.mshead .msn{grid-area:n;display:flex;align-items:center;gap:8px;min-width:0}
.mshead .ladder4{grid-area:l}
.mshead .msnext{grid-area:x;color:var(--ink)}
.msdet{padding:0 0 14px}

/* Postępy */
.classhero{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s5) 20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.ch-top{display:flex;gap:var(--s4);align-items:center}
.ch-top .rn{font-family:var(--display);font-style:italic;font-size:56px;line-height:1;color:var(--accent);min-width:64px;text-align:center}
.ch-top h2{font-family:var(--display);font-weight:500;font-size:var(--fs-xl)}
.req{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line);align-items:center;font-size:var(--fs-sm)}
.req .bar{grid-column:1/-1;height:6px}
.ladder{display:flex;flex-direction:column}
.ladder>div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ladder .rn{font-family:var(--display);font-style:italic;font-size:24px;line-height:1;color:var(--muted);text-align:center}
.ladder .cur .rn{color:var(--accent)}
.ladder .past .rn{color:var(--good)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3)}
.stat{border-top:2px solid var(--ink);padding:10px 2px 0}
.stat b{display:block;font-family:var(--body);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tgroup{border-top:1px solid var(--line)}
.tgroup>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;min-height:44px}
.tgroup>summary h3{display:flex;align-items:center;gap:8px}
.tgroup>.grid2{padding-bottom:var(--s4)}
.test{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.test .val{font-family:var(--body);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.test .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.val.est{color:var(--muted)}
.spark{width:100%;height:40px;display:block}
.addform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.addform.pairform{grid-template-columns:1fr 1fr}
.addform.pairform .field:nth-child(3),.addform.pairform .btn{grid-column:1/-1}
@media (max-width:420px){.addform{grid-template-columns:1fr 1fr}.addform .btn{grid-column:1/-1}}
.addform input{width:100%;min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pside{min-width:0}.pside .val{font-size:26px}
.thist summary{color:var(--accent);font-weight:700;font-size:var(--fs-sm);padding:8px 0;min-height:36px}
.logrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.logrow:first-child{border-top:0}
.chart{width:100%;height:auto;display:block}
.cbar:hover path{opacity:.8}
.ctable{border-collapse:collapse;margin-top:8px}
.ctable td,.ctable th{padding:4px 12px 4px 0;text-align:left;border-bottom:1px solid var(--line)}
.srow{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.sbar{display:grid;grid-template-columns:18px 1fr 70px;gap:8px;align-items:center}
.sbar .num:last-child{text-align:right}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.phgrid button{border:0;padding:0;background:none;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.phgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--surface-2)}

/* Biblioteka */
details.ex{border-top:1px solid var(--line)}
details.ex>summary{padding:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:44px}
details.ex .body{padding:0 0 16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.status button[aria-pressed="true"].s1{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.status button[aria-pressed="true"].s2{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.status button[aria-pressed="true"].s0{background:var(--surface-2);color:var(--ink);border-color:var(--ink)}
.focus{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.focus .htitle{font-size:24px}
.vmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:var(--fs-sm)}
.vmeta dt{color:var(--muted);font-weight:600}
.vmeta dd{margin:0}
.libfoot{border-top:1px solid var(--line);padding-top:var(--s3)}

/* okna: arkusz od dołu na telefonie, okno na środku od 600 px */
.modalbg{position:fixed;inset:0;z-index:60;background:rgba(20,12,16,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadeIn .2s var(--ease)}
@media (min-width:600px){.modalbg{align-items:center}}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:22px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow);animation:sheetIn .24s var(--ease)}
.modal .vstack{display:flex;flex-direction:column;gap:8px}.modal .vstack .btn{width:100%}
.modalbg.sheetbg{padding:0}
.modal.sheet{max-width:560px;border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;margin:0}
.modal.sheet::before{content:"";align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line-strong);flex:none;margin-bottom:4px}
@media (min-width:600px){.modalbg.sheetbg{padding:16px}.modal.sheet{border-radius:var(--r-lg);padding:22px}.modal.sheet::before{display:none}}
.sheet h2{font-family:var(--display);font-weight:500;font-size:26px}
.sheet h3{font-size:var(--fs-sm);font-weight:800}
.sheet-h{display:flex;flex-direction:column;gap:8px}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast.err{background:var(--warn);color:var(--surface)}

/* odtwarzacz */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.pl{width:100%;max-width:640px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:18px}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pl-top .mid{text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pl-top .mid .eyebrow{display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink);padding:0}
.iconbtn svg{width:22px;height:22px}
.iconbtn.ghost{border-color:transparent;background:none;color:var(--muted)}
.iconbtn.main{width:68px;height:68px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.iconbtn.main svg{width:30px;height:30px}
.pl-prog{height:4px;background:var(--surface-2);border-radius:9px;overflow:hidden}
.pl-prog span{display:block;height:100%;background:var(--accent)}
.pl-ex{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.pl-ex h2{font-family:var(--display);font-weight:500;font-size:var(--fs-2xl)}
.pl-ex .frl{justify-content:center}
.pl-ex .fr{font-size:18px}
.timer{position:relative;width:min(240px,62vw);aspect-ratio:1;margin:0 auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .t b{font-family:var(--body);font-size:clamp(56px,16vw,84px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pl-controls{display:flex;justify-content:center;align-items:center;gap:20px}
.pl-next{text-align:center;font-size:14px;color:var(--muted)}
.pl-card{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 0;min-height:44px;font-weight:700}
.rpe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* świętowanie: awans do klasy i kamień milowy */
.levelup{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.lu{margin:auto;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.lu .from{font-family:var(--display);font-style:italic;font-size:26px;color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.lu .numwrap{position:relative;padding:8px 40px}
.lu .rnum{display:block;font-family:var(--display);font-style:italic;font-size:clamp(120px,36vw,190px);line-height:.95;color:var(--accent);animation:luIn 1.2s cubic-bezier(.16,1,.3,1) both}
.lu .msbig{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(40px,11vw,64px);line-height:1.05;color:var(--area);padding:28px 0;animation:luIn 1.2s cubic-bezier(.16,1,.3,1) both}
.lu .arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lu .arc ellipse{stroke-dasharray:1;stroke-dashoffset:1;animation:luDraw 1.6s .2s cubic-bezier(.16,1,.3,1) forwards}
.lu .ln{font-family:var(--display);font-style:italic;font-size:22px}
.lu .rest{animation:luUp .9s .45s cubic-bezier(.16,1,.3,1) both}
@keyframes luIn{from{opacity:0;transform:scale(.55);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.lu .arc ellipse{stroke-dashoffset:0}}

   pointe:1 = ćwiczenie w pointach, alt = zamiennik na półpalcach (gdy S.pointe===false). */
const EX={
 w_march:{n:'Marsz z krążeniami ramion',c:'warm',d:'Energiczny marsz w miejscu, ramiona krążą raz w przód, raz w tył. Podnosi tętno i rozgrzewa barki.',cues:['Kolana wysoko, stopy miękko','Barki nisko, szyja długa'],yt:'rozgrzewka dla tancerzy 5 minut'},
 w_ankle:{n:'Point / flex i krążenia stóp',c:'warm',d:'W siadzie prostym naprzemiennie wyciągaj stopy (point) i przyciągaj do siebie (flex), potem krąż nimi w obie strony.',cues:['Point zaczyna się w kostce, potem śródstopie, na końcu palce','Kolana proste, ale nie przeprostowane'],err:'Zginanie samych palców zamiast pracy całej stopy.',yt:'ballet feet warm up point flex'},

 w_swing:{n:'Wymachy nóg przy drążku',fr:'grand battement',ph:'grã bat-MÃ',c:'warm',sd:1,d:'Trzymając się drążka lub krzesła, swobodnie wymachuj nogą w przód i w tył, potem w bok. Zaczynaj nisko, stopniowo coraz wyżej. To rozgrzewkowa wersja grand battement.',cues:['Tułów stabilny, ruch z biodra','Nie rzucaj nogi siłą, tylko rozgrzewaj zakres'],yt:'leg swings warm up dancers'},

 /* --- Szpagat przedni --- */
 f_lunge:{n:'Niski wykrok',c:'split',sd:1,d:'Kolano tylnej nogi na podłodze (podłóż ręcznik), przednia stopa przed kolanem. Przesuń biodra w przód i w dół, aż poczujesz rozciąganie z przodu biodra tylnej nogi.',cues:['Biodra ustawione na wprost','Podwiń lekko kość ogonową, wtedy mocniej poczujesz zginacz biodra'],yt:'low lunge hip flexor stretch splits'},
 f_half:{n:'Pół-szpagat',c:'split',sd:1,eq:'bloki',d:'Z wykroku przesuń biodra w tył, prostując przednią nogę. Stopa przednia w flex. Pochyl się z prostymi plecami.',cues:['Prowadź mostek do kolana, nie nos do kolana','Biodra nad tylnym kolanem'],yt:'half split stretch hamstrings'},
 f_pigeon:{n:'Gołąb',c:'split',sd:1,d:'Przednia noga zgięta przed sobą, tylna wyprostowana w tył. Rozciąga pośladek i rotatory biodra przedniej nogi, otwiera zginacz tylnej.',cues:['Czujesz nacisk w kolanie? Przysuń piętę bliżej biodra','Oddychaj w biodro'],err:'Opadanie biodra na bok. Podłóż blok lub poduszkę.',yt:'pigeon pose dancers flexibility'},
 f_couch:{n:'Couch stretch (przód uda)',c:'split',sd:1,d:'Kolano tylnej nogi przy ścianie lub kanapie, goleń pionowo w górę po ścianie, przednia stopa w wykroku. Stopniowo prostuj tułów.',cues:['Napnij pośladek tylnej nogi','Zacznij z tułowiem pochylonym, prostuj stopniowo'],yt:'couch stretch quad hip flexor splits'},
 f_split:{n:'Szpagat przedni z blokami',c:'split',sd:1,eq:'bloki',d:'Zsuwaj się do szpagatu z dłońmi na blokach po obu stronach. Zatrzymaj się na wysokości, na której możesz spokojnie oddychać, i trzymaj.',cues:['Biodra kwadratowo: kolec biodrowy tylnej nogi kieruj w podłogę','Tylne kolano patrzy w podłogę, nie w bok','Wisisz w powietrzu? Podłóż blok pod udo przedniej nogi'],err:'Otwieranie bioder na bok. Szpagat wygląda wtedy niżej, ale nie jest prosty.',yt:'square front splits tutorial'},
 f_pnf:{n:'PNF w pół-szpagacie',c:'split',sd:1,d:'Z pół-szpagatu napnij tył uda (wciskaj piętę w podłogę) przez 5 s, rozluźnij i pogłęb przez 10 s. Powtarzaj do końca czasu.',cues:['Napięcie na ok. 50% siły','Pogłębiaj na wydechu'],yt:'PNF stretching hamstrings splits'},
 f_active:{n:'Aktywne unoszenie nogi w siadzie',c:'split',sd:1,d:'W siadzie prostym, dłonie przy biodrach, unieś prostą nogę kilka cm nad podłogę i opuść. Buduje siłę w końcowym zakresie, która potem trzyma nogę wysoko w développé.',cues:['Plecy prosto, nie odchylaj się','Stopa w point, kolano wyprostowane'],yt:'active flexibility leg lifts dancers'},
 f_band:{n:'Rozciąganie z taśmą w leżeniu',c:'split',sd:1,eq:'taśma',d:'Na plecach, taśma na stopie. Prowadź prostą nogę do sufitu i dalej do siebie. Druga noga prosta na podłodze.',cues:['Obie łopatki i biodra na podłodze','Rozluźnij barki'],yt:'lying hamstring stretch band'},
 f_hf_lift:{n:'Aktywne unoszenie tylnej nogi w wykroku',c:'split',sd:1,eq:'bloki',d:'Z niskiego wykroku z dłońmi na blokach wyprostuj tylną nogę. Biodra kwadratowo, kość ogonowa lekko podwinięta. Unieś tylne kolano kilka centymetrów nad podłogę, przytrzymaj 3 s i odłóż. Pośladek i tył uda uczą się pracować w końcowym zakresie wyprostu biodra, czyli tam, gdzie w szpagacie zatrzymuje się tylna noga.',cues:['Podnoś z pośladka, nie z dołu pleców','Przednie kolano nad kostką, biodra nie uciekają w bok'],err:'Wygięcie w lędźwiach zamiast pracy biodra. Zmniejsz wykrok.',yt:'active hip extension lunge lift off splits'},
 f_split_slide:{n:'Szpagat ślizgowy z kontrolą',c:'split',sd:1,eq:'bloki, ręcznik albo skarpetki na gładkiej podłodze',d:'Zacznij w pół-szpagacie, dłonie na blokach, pod przednią piętą ręcznik. Przez 5 s zsuwaj przednią nogę do swojego najniższego szpagatu, wciskając piętę w podłogę jak przy hamowaniu. Na dole 2 oddechy, potem wróć, pomagając sobie dłońmi. Tył uda pracuje ekscentrycznie i nabiera siły tam, gdzie zwykle brakuje zakresu.',cues:['Hamuj ruch nogą przez cały czas, nie spadaj','Biodra kwadratowo, tylne kolano patrzy w podłogę'],err:'Zjazd na samych rękach bez napięcia nóg. To wtedy zwykłe rozciąganie.',yt:'sliding splits eccentric hamstring'},
 f_split_iso:{n:'Szpagat z napięciem',fr:'grand écart',ph:'grã-te-KAR',c:'split',sd:1,eq:'bloki',d:'W swoim najniższym szpagacie na blokach napnij obie nogi tak, jakbyś chciała zsunąć je do siebie: przednią piętę ciągnij w podłogę i do tyłu, tylne kolano w podłogę i do przodu. 10 s napięcia na około połowę siły, 10 s rozluźnienia i pogłębienia na wydechu. Powtarzaj do końca czasu.',cues:['Napięcie narasta stopniowo, bez szarpnięcia','Po każdym napięciu zejdź niżej o milimetry, nie centymetry'],err:'Wstrzymywanie oddechu.',yt:'PNF front splits contract relax'},
 f_over_front:{n:'Overspagat z przednią stopą na podwyższeniu',c:'split',sd:1,eq:'blok do jogi albo książki',d:'Tylko z pełnego, kwadratowego szpagatu. Przednią piętę połóż na niskim podwyższeniu (na początek 5–10 cm) i zsuń się do szpagatu, dłonie na blokach. Biodra schodzą tylko tak nisko, jak pozwala kwadratowe ustawienie. Podwyższenie zwiększaj o kilka centymetrów co kilka tygodni.',cues:['Przednie kolano proste, ale nie przeprostowane: lekko napnij przód uda','Tylne kolano i kolec biodrowy patrzą w podłogę'],err:'Otwieranie bioder, żeby usiąść niżej.',yt:'oversplit front foot elevated safely'},
 f_over_back:{n:'Overspagat z tylnym kolanem na podwyższeniu',c:'split',sd:1,eq:'blok do jogi albo poduszka',d:'Gdy overspagat z przednią stopą jest pewny. Tylne kolano (albo udo tuż nad kolanem) na niskim, miękkim podwyższeniu, przednia noga prosto na podłodze. Mocno rozciąga zginacz biodra tylnej nogi, ten sam, który ogranicza arabeskę i grand jeté.',cues:['Podwiń kość ogonową i napnij pośladek tylnej nogi','Tułów pionowo albo lekko w przód, nie w tył'],err:'Wygięcie w dole pleców zamiast otwarcia biodra.',yt:'back leg elevated oversplit hip flexor'},

 /* --- Szpagat poprzeczny --- */
 f_straddle:{n:'Rozkrok w siadzie (pancake)',c:'middle',d:'Siad w szerokim rozkroku, kolana i palce w sufit. Pochylaj się do przodu z prostymi plecami, prowadząc brzuch do podłogi.',cues:['Ruch z bioder, nie z zaokrąglania pleców','Usiądź na złożonym ręczniku, jeśli miednica ucieka w tył'],yt:'pancake stretch straddle tutorial'},
 f_frog:{n:'Żabka',c:'middle',d:'Na czworakach rozsuń kolana szeroko, golenie równolegle, stopy w flex. Przesuwaj biodra w tył.',cues:['Kolana na miękkim podłożu','Rozciąganie czujesz w pachwinach, nigdy w kolanach'],yt:'frog stretch dancers turnout'},
 f_butterfly:{n:'Motylek',c:'middle',d:'W siadzie złącz stopy, kolana na boki. Prosty kręgosłup, pochylaj się z bioder.',cues:['Pięty blisko: bardziej pachwiny; dalej: bardziej pośladki','Nie dociskaj kolan rękami'],yt:'butterfly stretch ballet'},
 f_wall:{n:'Rozkrok przy ścianie',c:'middle',d:'Leżąc na plecach pośladkami przy ścianie, rozłóż proste nogi w rozkroku i pozwól grawitacji pracować.',cues:['Całkowicie rozluźnij nogi','Pośladki przy samej ścianie'],yt:'wall straddle stretch middle splits'},
 f_cossack:{n:'Przysiad kozacki',c:'middle',sd:1,d:'Szeroki rozkrok, stopy lekko na zewnątrz. Przenieś ciężar na jedną nogę i zejdź w głęboki przysiad, druga noga prosta, palce w sufit. Wróć przez środek. Przywodziciele rozciągają się pod obciążeniem, a to dobrze przenosi się na szpagat poprzeczny.',cues:['Pięta nogi zgiętej zostaje na podłodze','Kolano nad palcami, klatka otwarta'],err:'Zaokrąglone plecy i opadająca klatka. Złap się krzesła dla równowagi.',yt:'cossack squat tutorial mobility'},
 f_pancake_lift:{n:'Pancake z unoszeniem dłoni',c:'middle',d:'Siad w szerokim rozkroku, kolana i palce w sufit. Pochyl się z prostymi plecami najniżej, jak możesz, dłonie na podłodze przed sobą. Unieś dłonie kilka centymetrów i utrzymaj pochylenie przez 3 s siłą bioder i brzucha, potem odłóż. To aktywny zakres w rozkroku.',cues:['Pochylenie z bioder, brzuch prowadzi do podłogi','Nogi napięte, kolana w sufit'],err:'Odchylanie się w tył przy unoszeniu dłoni.',yt:'pancake active lifts compression'},
 f_side_slide:{n:'Szpagat poprzeczny na ślizgu',fr:'grand écart à la seconde',ph:'grã-te-kar a la se-GĄD',c:'middle',eq:'bloki, skarpetki albo ręczniki pod stopami',d:'Z szerokiego rozkroku w staniu, dłonie na blokach przed sobą, rozsuwaj stopy powoli na boki do swojego zakresu. Biodra w linii ze stopami, nie za nimi. Trzymaj, spokojnie oddychając. Wychodzisz, przenosząc ciężar na dłonie i ściągając nogi do siebie.',cues:['Kolana i palce w sufit albo w przód, nigdy w podłogę','Ciężar na dłoniach, nogi puszczają stopniowo'],err:'Wypychanie bioder w tył, wtedy to bardziej żabka niż szpagat.',yt:'middle split sliding progression'},
 f_side_pnf:{n:'PNF w szpagacie poprzecznym',c:'middle',eq:'bloki',d:'W szpagacie ślizgowym albo w rozkroku przy ścianie wciskaj wewnętrzne krawędzie stóp w podłogę, jakbyś chciała złączyć nogi: 5 s na około połowę siły, potem 10 s rozluźnienia i pogłębienia na wydechu. Powtarzaj do końca czasu.',cues:['Napięcie łagodne, bez szarpnięcia','Po rozluźnieniu pogłębiaj o milimetry'],err:'Ból w pachwinie przy kości łonowej albo w kolanie: przerwij i zmniejsz zakres.',yt:'PNF middle splits contract relax'},

 /* --- Wygięcia --- */
 f_cobra:{n:'Sfinks / kobra',c:'back',d:'Leżąc na brzuchu, oprzyj się na przedramionach (sfinks) lub dłoniach (kobra). Otwiera przód tułowia, przygotowuje do cambré i arabeski.',cues:['Barki z dala od uszu','Najpierw wydłuż kręgosłup, potem go wygnij'],yt:'sphinx cobra stretch dancers back flexibility'},
 b_tspine:{n:'Mobilizacja górnych pleców na wałku',c:'back',eq:'wałek',d:'Na plecach, wałek w poprzek pod łopatkami, dłonie splecione za głową, pośladki na podłodze. Na wydechu odchyl się nad wałkiem, łokcie blisko siebie, i wróć. Przesuń wałek kilka centymetrów wyżej i powtórz. Uczy wyginać się z odcinka piersiowego, nie z lędźwi.',cues:['Żebra w dół, brzuch lekko napięty','Nigdy nie kładź wałka pod lędźwiami'],err:'Wypchnięty brzuch i wygięcie w dole pleców.',yt:'thoracic extension foam roller'},
 b_bench:{n:'Otwieranie barków przy krześle',c:'back',eq:'krzesło albo kanapa, kij albo pasek',d:'Klęk przodem do krzesła, łokcie na siedzisku na szerokość barków, dłonie złączone nad głową (możesz trzymać kij). Cofaj biodra nad kolana i opuszczaj klatkę w stronę podłogi. Otwiera barki i mięśnie najszersze grzbietu, które najbardziej skracają mostek i cambré.',cues:['Brzuch lekko napięty, żeby nie zapadać się w lędźwiach','Głowa między ramionami, szyja długa'],err:'Wypychanie żeber zamiast opuszczania klatki.',yt:'bench thoracic stretch elbows elevated'},
 b_backext:{n:'Aktywne wygięcie w leżeniu przodem',c:'back',d:'Na brzuchu, ręce w 5. pozycji albo dłonie przy skroniach. Wydłuż się, potem unieś mostek i ręce nad podłogę, przytrzymaj 3 s i odłóż. Siła grzbietu pozwala trzymać cambré i arabeskę, zamiast w nie wpadać.',cues:['Najpierw długość, potem wysokość','Pośladki aktywne, ale nie zaciśnięte do bólu'],err:'Zadzieranie głowy i ściskanie karku.',yt:'prone back extension dancers'},
 b_camel:{n:'Wielbłąd (wygięcie w klęku)',c:'back',d:'Klęk, biodra nad kolanami, palce stóp podwinięte, dłonie na pośladkach. Unieś mostek w górę i w tył, biodra lekko do przodu. Jeśli to łatwe, sięgnij dłońmi do pięt. Głowa idzie za ruchem na samym końcu.',cues:['Biodra nad kolanami, nie siadaj w tył','Wyrośnij z mostka, zanim się odchylisz'],err:'Załamanie w lędźwiach i głowa opadająca na początku ruchu.',yt:'camel pose backbend tutorial'},
 b_bridge:{n:'Mostek z podłogi z przytrzymaniem',c:'back',d:'Na plecach, stopy na szerokość bioder blisko pośladków, dłonie przy uszach palcami do barków. Wypchnij się do mostka, wyprostuj ręce i przytrzymaj 10 s, oddychając. Schodź, kładąc najpierw tył głowy (broda do klatki), potem plecy.',cues:['Barki nad nadgarstkami: przenieś ciężar w stronę dłoni','Kolana równolegle, nie uciekają na boki','Pchaj podłogę dłońmi i oddychaj'],err:'Ciężar na stopach i barki daleko za dłońmi. Wtedy całe wygięcie idzie w lędźwie.',yt:'full bridge wheel pose shoulders tutorial'},
 b_bridge_rock:{n:'Mostek z przenoszeniem barków nad dłonie',c:'back',d:'W mostku z prostymi rękami lekko ugnij kolana i przenieś barki do przodu nad nadgarstki, a nawet trochę za nie, potem wróć. Powoli, na wydechu w stronę dłoni. Otwarte barki skracają odległość dłoni od pięt najbardziej.',cues:['Ręce proste przez cały czas','Ruch z nóg i barków, nie z bujania w lędźwiach'],yt:'bridge rocks shoulder opening'},
 b_bridge_walk:{n:'Mostek z podchodzeniem dłońmi do stóp',c:'back',d:'Z mostka z prostymi rękami przesuń dłonie drobnymi krokami w stronę stóp. Zatrzymaj się w najgłębszym miejscu, w którym możesz oddychać, na 5–10 s. Wróć i zejdź z mostka.',cues:['Najpierw barki nad dłonie, potem kolejny krok','Przy ucisku w dole pleców cofnij się o krok'],err:'Uginanie rąk w łokciach.',yt:'deepen bridge walk hands to feet'},
 b_wall_walk:{n:'Zejście do mostka po ścianie',c:'back',d:'Stań tyłem do ściany, mniej więcej na długość ręki od niej. Unieś ręce, wyrośnij i odchyl się, kładąc dłonie na ścianie. Schodź dłońmi po ścianie aż do podłogi i mostka, potem wróć w górę tą samą drogą. Z czasem stań dalej od ściany i rób mniej kroków dłońmi.',cues:['Biodra lekko do przodu, kolana miękkie','Najpierw górne plecy, potem reszta','Wzrok idzie za dłońmi po ścianie'],err:'Rzucenie się w dół. Każdy krok dłońmi ma być spokojny.',yt:'wall walk down backbend tutorial'},
 b_dropback:{n:'Mostek ze stania z asekuracją',c:'back',eq:'osoba do asekuracji albo bloki przy ścianie',d:'Ktoś stoi obok i trzyma cię w pasie albo schodzisz dłońmi na bloki ustawione przy ścianie. Stopy na szerokość bioder, ręce w górę, wyrośnij, odchyl górne plecy, potem przesuń biodra do przodu i zejdź dłońmi na podłogę miękko, przez lekko ugięte łokcie. Wróć z pomocą albo połóż się na plecach.',cues:['Wydech przy schodzeniu','Zobacz podłogę za sobą, zanim dłonie jej dotkną','Biodra do przodu przez cały ruch'],err:'Opadanie na głowę albo zamykanie oczu. Pierwsze próby zawsze z asekuracją.',yt:'drop back to bridge progression spotting'},
 b_cambre:{n:'Cambré w tył przy drążku',fr:'cambré derrière',ph:'kã-bre de-RJER',c:'back',d:'Bokiem do drążka w 1. albo 5. pozycji, wolna ręka w 5. pozycji. Wyrośnij przez czubek głowy, potem odchyl się z górnych pleców na 4 liczby, ręka prowadzi łuk. Wróć na 4 liczby, wyrastając z mostka. Biodra zostają nad stopami.',cues:['Najpierw w górę, potem w tył','Pośladki i brzuch trzymają biodra nad stopami','Szyja długa, głowa kończy linię pleców'],err:'Wypychanie bioder do przodu i zapadanie się w lędźwiach.',yt:'cambre back ballet upper back tutorial'},

 /* --- Siła i core --- */
 s_plank:{n:'Plank na przedramionach',c:'str',d:'Łokcie pod barkami, ciało w jednej linii od głowy do pięt.',cues:['Pępek do kręgosłupa, pośladki napięte','Nie zapadaj się w barkach'],yt:'plank form core dancers'},
 s_side:{n:'Plank bokiem',c:'str',sd:1,d:'Na przedramieniu, nogi proste jedna na drugiej, biodra wysoko.',cues:['Biodra w linii z barkami','Druga ręka na biodrze albo w górze'],yt:'side plank dancers'},
 s_deadbug:{n:'Dead bug',c:'str',d:'Na plecach, ręce w górę, kolana nad biodrami. Naprzemiennie opuszczaj przeciwną rękę i nogę, nie odrywając lędźwi od podłogi.',cues:['Lędźwie przyklejone do podłogi','Powoli, na wydechu'],yt:'dead bug exercise form'},
 s_hollow:{n:'Hollow hold („łódeczka”)',c:'str',d:'Na plecach unieś łopatki i proste nogi nad podłogę, ręce wzdłuż uszu. Trzymaj.',cues:['Lędźwie w podłogę','Za trudne? Zegnij kolana albo opuść ręce do bioder'],yt:'hollow body hold beginner'},
 s_bridge:{n:'Mostek biodrowy na jednej nodze',c:'str',sd:1,d:'Na plecach, jedna stopa na podłodze, druga noga prosta w górę. Unieś biodra i opuść.',cues:['Biodra równo, miednica się nie przechyla','Wypychaj z pięty'],yt:'single leg glute bridge'},
 s_clam:{n:'Muszelka z gumą',c:'str',sd:1,eq:'guma',d:'Leżąc na boku, kolana zgięte, guma nad kolanami. Otwieraj górne kolano, stopy razem. Wzmacnia głębokie rotatory, czyli mięśnie turnoutu.',cues:['Miednica nie odchyla się w tył','Powoli, z przytrzymaniem na górze'],yt:'clamshell band turnout dancers'},
 s_turnout:{n:'Rotacja z passé w leżeniu na boku',c:'str',sd:1,d:'Leżąc na boku, górna noga w passé. Otwieraj kolano do sufitu i zamykaj, kontrolując ruch z biodra.',cues:['Palce stopy cały czas przy kolanie','Biodra jedno nad drugim'],yt:'turnout strengthening exercises ballet'},
 s_seconde:{n:'Développé à la seconde z przytrzymaniem',fr:'développé à la seconde',ph:'de-wlo-pe a la se-GĄD',c:'str',sd:1,d:'Przy drążku: przez passé wyprostuj nogę w bok, przytrzymaj 3–5 s na najwyższej wysokości, którą kontrolujesz, opuść przez tendu.',cues:['Biodro nogi pracującej zostaje nisko','Kolano patrzy w sufit'],err:'Podciąganie biodra i przechylanie tułowia, żeby noga była wyżej.',yt:'developpe a la seconde tutorial'},
 s_devfront:{n:'Développé devant z przytrzymaniem',fr:'développé devant',ph:'de-wlo-pe de-WÃ',c:'str',sd:1,d:'Przy drążku: przez passé rozwiń nogę do przodu, przytrzymaj 3–5 s na najwyższej wysokości, którą kontrolujesz, opuść przez tendu.',cues:['Nie odchylaj tułowia w tył','Biodra równo, kolano proste'],err:'Przechylanie miednicy w tył, żeby noga poszła wyżej.',yt:'developpe devant tutorial higher'},
 s_devback:{n:'Développé derrière z przytrzymaniem',fr:'développé derrière',ph:'de-wlo-pe de-RJER',c:'str',sd:1,d:'Twarzą do drążka: przez passé rozwiń nogę w tył do arabeski, przytrzymaj 3–5 s, opuść przez tendu.',cues:['Tułów może lekko pochylić się w przód, ale plecy długie','Kolano nogi pracującej patrzy w bok, nie w podłogę'],yt:'developpe derriere arabesque tutorial'},
 s_kneelift:{n:'Unoszenie nogi bez rąk (à la seconde)',c:'str',sd:1,d:'Przy drążku złap nogę ręką w bok na wysokości, której nie utrzymasz sama, puść rękę i spróbuj utrzymać 2–3 s. Uczy mięśnie pracować w wysokim zakresie.',cues:['Biodro w dół','Lepiej niżej i stabilnie niż wysoko z przechylonym tułowiem'],yt:'leg hold release exercise extension'},
 s_arab:{n:'Arabeska w klęku podpartym',fr:'arabesque',ph:'a-ra-BESK',c:'str',sd:1,d:'Na czworakach unieś prostą nogę w tył do wysokości biodra lub trochę wyżej, przytrzymaj 2 s i opuść.',cues:['Nie skręcaj miednicy','Wydłużaj nogę w tył, zamiast tylko ją podnosić'],yt:'arabesque strengthening exercises'},
 s_sumo:{n:'Plié w 2. pozycji + relevé',fr:'grand plié, relevé',ph:'grã pli-JE, re-le-WE',c:'str',d:'W szerokiej 2. pozycji zejdź do plié, wyprostuj nogi i wejdź na relevé. Z relevé schodź powoli.',cues:['Kolana nad palcami','Na relevé ciężar nad dużym i drugim palcem'],yt:'plie releve strength ballet'},
 s_rdl:{n:'Martwy ciąg na jednej nodze (RDL)',c:'str',sd:1,eq:'hantla albo butelka wody (opcjonalnie)',d:'Stań na jednej nodze z lekko ugiętym kolanem. Pochylaj tułów z prostymi plecami, wysuwając wolną nogę w tył, aż poczujesz mocne rozciąganie tyłu uda nogi podporowej. W dół przez 3 s, w górę przez 1 s z napięciem pośladka. Siła w rozciągnięciu przenosi się na szpagat i wysokie nogi.',cues:['Biodra równo, miednica nie otwiera się w bok','Jedna linia od głowy do pięty wolnej nogi'],err:'Zaokrąglanie pleców, żeby zejść niżej.',yt:'single leg romanian deadlift form'},
 s_copenhagen:{n:'Plank kopenhaski (krótka dźwignia)',c:'str',sd:1,eq:'krzesło albo ławka',d:'Plank bokiem na przedramieniu, górne kolano oparte na siedzisku krzesła, dolna noga pod siedziskiem. Unieś biodra, aż ciało będzie w jednej linii. Wzmacnia przywodziciele, które chronią pachwiny i trzymają nogi w rozkroku.',cues:['Biodra wysoko, bark nad łokciem','Łatwiej: dolna stopa na podłodze. Trudniej: na krześle stopa zamiast kolana'],err:'Opadające biodra i zapadnięty bark.',yt:'copenhagen plank short lever'},

 /* --- Stopy --- */
 ft_dome:{n:'Doming (kopułka stopy)',c:'feet',sd:1,d:'Siedząc, stopa płasko na podłodze. Unieś łuk stopy, przyciągając główki śródstopia w stronę pięty, bez zginania palców. Przytrzymaj 3 s.',cues:['Palce długie, nie zaciskaj ich','To te mięśnie trzymają cię potem na pointach'],yt:'foot doming exercise dancers'},
 ft_band:{n:'Point / flex z taśmą',c:'feet',sd:1,eq:'taśma',d:'W siadzie prostym taśma pod śródstopiem. Powoli wyciągaj stopę przez półpalce do pełnego pointu przeciw oporowi i wracaj tą samą drogą.',cues:['Przejdź przez demi-pointe, nie skacz od razu do pointu','Bez zaginania palców'],err:'Sierpowanie stopy do środka (sickling).',yt:'theraband exercises ballet feet'},
 ft_ever:{n:'Ewersja i inwersja z taśmą',c:'feet',sd:1,eq:'taśma',d:'Taśma wokół stopy, koniec trzymany z boku. Odwracaj stopę na zewnątrz przeciw oporowi, potem do środka. Chroni przed skręceniem kostki.',cues:['Ruch tylko w kostce, kolano stoi','Powoli w obie strony'],yt:'ankle eversion theraband dancers'},
 ft_rel2:{n:'Wolne relevés na obu nogach',fr:'relevé',ph:'re-le-WE',c:'feet',d:'Przy drążku, w 1. lub równoległej pozycji: 4 liczby w górę na wysokie półpalce, 4 w dół.',cues:['Kostki nie uciekają na zewnątrz','Wyrastaj w górę, nie tylko pchaj stopami'],yt:'releve exercises ballet strong ankles'},
 ft_rel1:{n:'Relevé na jednej nodze',fr:'relevé, sur le cou-de-pied',ph:'re-le-WE, sür le ku de PJE',c:'feet',sd:1,d:'Na jednej nodze przy drążku (druga w sur le cou-de-pied) wchodź na wysokie półpalce i schodź powoli.',cues:['Pięta w linii z drugim palcem','Kolano proste na górze'],yt:'single leg releve ballet'},
 ft_towel:{n:'Zbieranie ręcznika palcami',c:'feet',d:'Ręcznik płasko na podłodze. Przyciągaj go do siebie samymi palcami stopy, co kilka chwytów zmieniaj nogę.',cues:['Pięta w miejscu','Pracuj całymi palcami, też małym'],yt:'towel scrunch foot exercise'},
 ft_roll:{n:'Rolowanie stopy',c:'cool',sd:1,eq:'piłka / wałek',d:'Roluj podeszwę stopy na piłce lub wałku, szukając napiętych miejsc.',cues:['Nacisk umiarkowany','Na tkliwym punkcie zatrzymaj się 10 s'],yt:'foot rolling dancers'},
 ft_toe_yoga:{n:'Joga palców',c:'feet',d:'Stopy płasko na podłodze. Unieś sam duży palec, pozostałe zostają w podłodze, potem odwrotnie: duży palec w podłodze, cztery pozostałe w górę. Osobna kontrola palców stabilizuje stopę na poincie.',cues:['Stopa nie przetacza się na boki','Na początku możesz pomóc sobie ręką'],yt:'toe yoga exercise foot strength'},
 ft_soleus:{n:'Relevé z ugiętym kolanem',fr:'relevé',ph:'re-le-WE',c:'feet',sd:1,d:'Przy drążku na jednej nodze, kolano lekko ugięte jak w demi-plié. Wchodź na wysokie półpalce i schodź powoli, cały czas z tym samym ugięciem. Wzmacnia mięsień płaszczkowaty, który pracuje w każdym plié, relevé i lądowaniu.',cues:['Kolano zostaje ugięte przez cały ruch','Pięta w linii z drugim palcem'],yt:'bent knee calf raise soleus'},
 ft_dome_stand:{n:'Kopułka stopy na jednej nodze',fr:'sur le cou-de-pied',ph:'sür le ku de PJE',c:'feet',sd:1,d:'Na jednej nodze przy drążku unieś łuk stopy jak w kopułce, nie zginając palców, przytrzymaj 3 s i rozluźnij. Trudniej: druga noga w sur le cou-de-pied, bez trzymania się.',cues:['Palce długie i rozłożone','Kolano nad drugim palcem, nie ucieka do środka'],yt:'short foot exercise standing single leg'},
 ft_rel1_slow:{n:'Wolne relevé na jednej nodze 3–1–3',fr:'relevé',ph:'re-le-WE',c:'feet',sd:1,d:'Przy drążku na jednej nodze, druga w sur le cou-de-pied: 3 s w górę na najwyższe półpalce, 1 s przytrzymania, 3 s w dół. Powolne zejście buduje siłę, dzięki której schodzisz z pointy, a nie z niej spadasz.',cues:['Najwyżej, jak się da, w każdym powtórzeniu','Kostka w linii, bez sierpowania'],err:'Opadanie pięty na ostatnich centymetrach.',yt:'slow eccentric single leg calf raise dancers'},
 ft_bal_eyes:{n:'Balans z zamkniętymi oczami',c:'feet',sd:1,d:'Na płaskiej stopie, druga noga w sur le cou-de-pied, ręce w 1. pozycji. Zamknij oczy i utrzymaj równowagę. Stopa i kostka uczą się korygować bez pomocy wzroku, co przydaje się na pointach i w obrotach.',cues:['Ciężar na trzech punktach: pięta, duży i mały palec','Gdy tracisz równowagę, otwórz oczy i zacznij od nowa'],yt:'single leg balance eyes closed ankle'},
 ft_hops:{n:'Małe podskoki na jednej nodze',fr:'temps levé',ph:'tã le-WE',c:'feet',sd:1,d:'Na jednej nodze lekkie, niskie podskoki w miejscu, stopa w pełnym poincie w powietrzu, lądowanie przez palce do plié. Sprężysta kostka to szybsze i lżejsze relevés na pointach.',cues:['Lądowanie ciche, pięta dotyka podłogi','Kolano nad palcami'],err:'Lądowanie na płaską stopę z prostym kolanem.',yt:'single leg hops ankle stiffness dancers'},

 /* --- Pointy (pointe:1, eq:'pointy', alt = zamiennik na półpalcach) --- */
 ft_pointe:{n:'Relevés w pointach przez półpalce',fr:'relevé sur les pointes',ph:'re-le-we sür le PŁĘT',c:'pointe',eq:'pointy',pointe:1,alt:'ft_rel2',d:'Twarzą do drążka, w 1. lub równoległej pozycji. Przez demi-pointe na pełne pointe i powoli w dół.',cues:['Przejście przez półpalce w górę i w dół','Kolana proste, ciężar nad dużym i drugim palcem','Brzuch i pośladki aktywne: wyrastaj z pointów'],err:'Wpadanie na pointe za daleko albo ze zgiętymi kolanami.',yt:'pointe exercises at the barre beginner'},
 ft_echappe:{n:'Échappés na pointach',fr:'échappé sur les pointes',ph:'e-sza-pe sür le PŁĘT',c:'pointe',eq:'pointy',pointe:1,alt:'ft_rel2',d:'Twarzą do drążka: z 5. pozycji w plié, échappé na pointe do 2. pozycji i powrót do 5. w plié. Na zmianę do 2. i 4. pozycji.',cues:['Nogi otwierają się na równą szerokość','Lądowanie przez stopę w miękkie plié'],yt:'echappe en pointe tutorial'},
 pt_prep:{n:'Rozgrzanie stóp w pointach',c:'pointe',pointe:1,eq:'pointy',alt:'ft_band',d:'Twarzą do drążka w założonych pointach. Na zmianę przetaczaj jedną stopę przez półpalce na pełną pointę i z powrotem, druga stoi płasko. Potem 8 razy na obu stopach razem. Stopy się rozgrzewają, a buty układają.',cues:['Przez każdą fazę: płasko, półpalce, pointa','Kolano ugina się w drodze w górę i prostuje na poincie'],yt:'pointe warm up at the barre feet'},
 pt_sous:{n:'Sous-sus w pointach',fr:'sous-sus',ph:'su-SÜ',c:'pointe',pointe:1,eq:'pointy',alt:'ft_rel2',d:'Twarzą do drążka: z 5. pozycji w demi-plié wejdź na pointy, ściągając stopy do ciasnej 5. pozycji pod sobą, tak że z przodu widać jakby jedną nogę. Zejdź przez plié do 5.',cues:['Nogi ściśnięte od wewnętrznej strony ud','Ciężar nad środkiem, nie na tylnej nodze'],err:'Luka między nogami na pointach.',yt:'sous sus pointe tutorial'},
 pt_releve1:{n:'Relevé na jednej nodze w pointach do retiré',fr:'relevé passé sur la pointe',ph:'re-le-we pa-se sür la PŁĘT',c:'pointe',sd:1,pointe:1,eq:'pointy',alt:'ft_rel1',d:'Bokiem do drążka, lekko trzymając się jedną ręką. Z demi-plié na jednej nodze wejdź na pointę, druga noga od razu do retiré. Przytrzymaj 1 s i zejdź przez plié. Na tej sile stoi pirouette w pointach.',cues:['Noga podporowa prosta, kolano nad palcami','Nie siadaj w biodrze nogi podporowej','Wyrastaj z pointy, nie wiś na drążku'],err:'Niedochodzenie do pełnej pointy.',yt:'single leg releve on pointe retire'},
 pt_pique:{n:'Piqué w pointach do passé i arabeski',fr:'piqué',ph:'pi-KE',c:'pointe',sd:1,pointe:1,eq:'pointy',alt:'ft_rel1',d:'Bokiem do drążka: z demi-plié na nodze podporowej zrób krok prosto na pointę drugiej nogi, wbijając ją w podłogę, od razu do passé, potem zamknij do 5. w plié. Co drugą serię rób piqué do arabeski.',cues:['Krok na prostą nogę, bez podskoku','Wejście blisko, pod biodro, nie daleko w bok'],err:'Wchodzenie na ugiętą nogę.',yt:'pique on pointe at the barre'},
 pt_bourree:{n:'Bourrée w pointach',fr:'pas de bourrée suivi',ph:'pa de bu-re süi-WI',c:'pointe',pointe:1,eq:'pointy',alt:'ft_rel2',d:'Na pointach w ciasnej 5. pozycji drobne, szybkie przestawianie stóp: najpierw w miejscu, potem w bok. Kolana lekko miękkie, ruch z dołu nóg, tułów spokojny jak na wodzie.',cues:['Kroki maleńkie, stopy cały czas blisko siebie','Nie opadaj z pointów w trakcie serii'],err:'Coraz szersza 5. pozycja i ciężkie kroki.',yt:'bourree pointe tutorial'},
 pt_balance:{n:'Balans w pointach w passé',fr:'équilibre en retiré',ph:'e-ki-libr ã re-ti-RE',c:'pointe',sd:1,pointe:1,eq:'pointy',alt:'t_bal',d:'Z 5. pozycji relevé do passé na poincie, puść drążek i utrzymaj balans. Zejdź przez plié, zanim stracisz kontrolę. Każde powtórzenie to jedna próba.',cues:['Ciężar lekko do przodu, nad palcami','Żebra zamknięte, ręce w 1. pozycji'],err:'Odchylanie się w tył, gdy kolano otwiera się w bok.',yt:'balance on pointe passe tips'},
 pt_circuit:{n:'Seria wytrzymałościowa w pointach',c:'pointe',pointe:1,eq:'pointy',alt:'ft_rel1_slow',d:'Bez przerwy, twarzą do drążka: 16 relevés w 1. pozycji, 16 sous-sus, 8 échappés, 30 s bourrée w miejscu. Między ćwiczeniami tylko zejście na płaskie stopy. Gdy technika się psuje, zatrzymaj się na 30 s i dokończ.',cues:['Ostatnie powtórzenie tak czyste jak pierwsze','Oddychaj miarowo'],err:'Kończenie serii na siłę, z ugiętymi kolanami.',yt:'pointe endurance exercises barre'},
 pt_pir:{n:'Pojedyncza pirouette en dehors w pointach',fr:'pirouette en dehors sur la pointe',ph:'pi-rłet ã de-or sür la PŁĘT',c:'pointe',sd:1,pointe:1,eq:'pointy',alt:'t_pir1',d:'Z 4. pozycji w plié pojedyncza pirouette na poincie, zakończenie przez plié w 5. albo 4. pozycji. Gdy jest niepewnie, wróć do ćwierć- i półobrotów.',cues:['Na pełną pointę od razu, bez dopychania','Passé wysoko i z przodu','Zejście przez stopę, nie spadanie'],err:'Obrót na niepełnej poincie albo z ugiętym kolanem.',yt:'single pirouette on pointe tutorial'},
 pt_var:{n:'Fragment wariacji w pointach',c:'pointe',pointe:1,eq:'pointy',d:'Przetańcz 1–2 minuty wariacji, której się uczysz (Biblioteka → Wariacje), w pointach i w pełnym tempie. To sprawdzian wytrzymałości w prawdziwym tańcu: ostatnie kroki mają być tak czyste jak pierwsze.',cues:['Tylko na podłodze, na której pointy się nie ślizgają','Gdy stopy są zmęczone, zatańcz fragment na półpalcach'],yt:'ballet variation on pointe'},

 /* --- Piruety --- */
 t_tendu:{n:'Battement tendu en croix',fr:'battement tendu',ph:'bat-mã tã-DÜ',c:'turn',sd:1,d:'Przy drążku: z 1. lub 5. pozycji wysuwaj stopę po podłodze do pointu w przód, w bok i w tył, wracając pełnym ruchem.',cues:['Stopa przechodzi przez półpalce w obie strony','Biodra w miejscu, turnout z bioder'],yt:'battement tendu tutorial'},
 t_bal:{n:'Balans w passé na relevé',fr:'retiré, passé relevé',ph:'re-ti-RE, pa-se re-le-WE',c:'turn',sd:1,d:'Z 5. pozycji wejdź na relevé passé i utrzymaj się jak najdłużej bez drążka. Kilka prób na stronę.',cues:['Palec przy kolanie z przodu, kolano otwarte w bok','Ciężar lekko do przodu, nad palcami','Żebra zamknięte, szyja długa'],err:'Odchylanie się w tył, gdy kolano idzie w bok.',yt:'how to balance in passe releve ballet'},
 t_spot:{n:'Spotting',c:'turn',d:'Wybierz punkt na wysokości oczu. Obracaj się drobnymi krokami w miejscu, zostawiając wzrok na punkcie jak najdłużej i szybko przekręcając głowę.',cues:['Głowa odchodzi ostatnia i wraca pierwsza','Ruch głowy szybki i ostry'],yt:'how to spot turns ballet'},
 t_prep:{n:'Przygotowanie do pirouette (bez obrotu)',fr:'préparation pour pirouette en dehors',ph:'pre-pa-ra-SJĄ pur pi-rłet ã de-OR',c:'turn',sd:1,d:'Z 4. pozycji w plié wejdź na relevé passé i zatrzymaj się w pozycji obrotu na 2 s. Zamknij do 5. pozycji z tyłu.',cues:['Plié na obu nogach równo','Relevé i passé jednym ruchem','Ręce zamykają się do 1. pozycji'],yt:'pirouette preparation fourth position'},
 t_quarter:{n:'Ćwierć- i półobroty',c:'turn',sd:1,d:'Z przygotowania z 4. pozycji wykonaj ćwierć obrotu, potem pół obrotu na relevé passé, z kontrolowanym zakończeniem.',cues:['Spotting w każdym kierunku','Najpierw czyste zakończenie, potem więcej obrotu'],yt:'quarter turn drill pirouette'},
 t_pir1:{n:'Pojedyncze pirouette en dehors',fr:'pirouette en dehors',ph:'pi-rłet ã de-OR',c:'turn',sd:1,d:'Z 4. pozycji pojedynczy obrót en dehors, zakończenie w 4. lub 5. pozycji. Licz tylko czyste próby: stabilne zakończenie, bez podskoku.',cues:['Wypychaj podłogę, nie kręć ramionami','Najpierw pozycja, potem obrót','Zatrzymaj się w passé na 2 s przed zejściem'],err:'Za dużo siły z rąk, obrót „rzucony”.',yt:'single pirouette en dehors tutorial'},
 t_pir2:{n:'Podwójne pirouette en dehors',fr:'double pirouette en dehors',ph:'dubl pi-rłet ã de-OR',c:'turn',sd:1,d:'Ta sama technika co w pojedynczej: więcej siły z plié, wyższe relevé, ręce szybciej zamykają się do 1. pozycji, a głowa robi dwa szybkie spotty. Lepsza czysta pojedyncza niż brudna podwójna. Licz tylko czyste: stabilne zakończenie, bez podskoku.',cues:['Wyższe relevé, łatwiejszy obrót','Druga rotacja to głównie szybsza głowa'],yt:'double pirouette tips ballet'},
 tr_snap:{n:'Szybkie relevé do passé',fr:'relevé passé',ph:'re-le-we pa-SE',c:'turn',sd:1,d:'Bokiem do drążka z 5. pozycji: demi-plié i jednym szybkim ruchem relevé z nogą w passé. Przytrzymaj 2 s, puszczając drążek, i zamknij do 5. z tyłu. Pozycja ma być gotowa w chwili dojścia na relevé, nie chwilę później.',cues:['Stopa dochodzi do kolana w tym samym momencie, w którym pięta idzie w górę','Wysokie relevé, ciężar nad dużym i drugim palcem'],err:'Najpierw relevé, potem dociąganie nogi.',yt:'releve passe snap ballet'},
 tr_dd_prep:{n:'Przygotowanie do pirouette en dedans',fr:'préparation pour pirouette en dedans',ph:'pre-pa-ra-sją pur pi-rłet ã de-DÃ',c:'turn',sd:1,d:'4. pozycja: przednia noga w demi-plié, tylna prosta, ręce w 4. pozycji. Relevé na przedniej nodze, tylna przez 2. pozycję do passé, ręce zamykają się do 1. Zatrzymaj się na relevé na 2 s, bez obrotu.',cues:['Plié na nodze podporowej, tylna noga prosta i aktywna','Barki zostają przodem, nie zaczynaj obrotu ramionami','Biodro nogi podporowej nad stopą'],err:'Siadanie w biodrze i za wczesne skręcanie barków.',yt:'pirouette en dedans preparation fourth'},
 tr_pir1_dd:{n:'Pojedyncze pirouette en dedans',fr:'pirouette en dedans',ph:'pi-rłet ã de-DÃ',c:'turn',sd:1,d:'Z przygotowania en dedans pojedynczy obrót w stronę nogi podporowej, zakończenie w 4. albo 5. pozycji. Licz tylko czyste: stabilne zakończenie, bez podskoku.',cues:['Spotting od pierwszej chwili, głowa zostaje z przodu','Noga pracująca od razu do passé, kolano otwarte'],err:'Obrót zaczęty barkami przed wejściem na relevé.',yt:'pirouette en dedans tutorial'},
 tr_single_hold:{n:'Pojedyncza z balansem na końcu',fr:'pirouette en dehors',ph:'pi-rłet ã de-OR',c:'turn',sd:1,d:'Pojedyncze en dehors, a po obrocie zostań na relevé w passé przez 3 s, zanim zamkniesz do 4. albo 5. Jeśli utrzymujesz balans po pojedynczej, masz oś na podwójną.',cues:['Obrót kończy się w tej samej pozycji, w której się zaczął','Ręce nieruchome w 1. pozycji podczas balansu'],err:'Opuszczanie relevé pod koniec obrotu.',yt:'pirouette hold balance finish'},

const normFr=s=>String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/\s+/g,' ').trim();
/* PHON z kluczami po normalizacji (literówki w kluczach z diakrytykami też trafią) */
const PHON_N=Object.fromEntries(Object.entries(PHON).map(([k,v])=>[normFr(k),v]));
/* zapis wymowy: z pola ph wpisu (EX/STEP), inaczej ze słownika PHON (także dla nazw złożonych „a, b”), inaczej '' */
function phOf(x){
  if(x&&typeof x==='object'){if(x.ph)return x.ph;x=x.fr||x.n}
  const k=normFr(x);if(!k)return '';if(PHON_N[k])return PHON_N[k];
  const parts=k.split(/\s*[,/]\s*/);if(parts.length>1&&parts.every(p=>PHON_N[p]))return parts.map(p=>PHON_N[p]).join(', ');
  return '';
}

/* linki do ćwiczenia / planu / kroku: najpierw DMC, potem YouTube; w obrębie źródła: tut, follow, class. opt = {kind, ph} */
function linksFor(scope,id,opt){
  opt=opt||{};const L=((VLINKS[scope]||{})[id]||[]).slice();
  const so={dmc:0,yt:1},ko={tut:0,follow:1,class:2};
  return L.filter(v=>(!opt.kind||v.kind===opt.kind)&&(opt.ph==null||!v.ph||v.ph.includes(opt.ph)))
    .map((v,i)=>[v,i]).sort((a,b)=>(so[a[0].src]-so[b[0].src])||(ko[a[0].kind]-ko[b[0].kind])||(a[1]-b[1])).map(x=>x[0]);
}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const dow=s=>parse(s).getDay();
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};

/* Migracja nigdy nie usuwa ani nie przepisuje tests, log, moves, corrections, videos, vars, combos, quiz, pron, steps, pointeChecks, level, levelSince. */
function migrate(s){
  const d=defaults();const o=Object.assign(d,s||{});
  for(const k of['tests','videos','flags','progStart','steps','ytPick','quiz','pointeChecks','vars','pron','moves','ms','legacy'])o[k]=Object.assign({},o[k]);
  for(const k of['log','corrections','combos'])o[k]=Array.isArray(o[k])?o[k].slice():[];
  if(s&&(s.v||1)<2)toV2(o,s);
  o.active=(Array.isArray(o.active)?o.active:[]).filter(id=>PROG[id]);
  if(!o.active.length)o.active=PLAN_IDS.slice();
  return o;
}
/* v1 → v2: nowe plany (szpagaty, wygięcia, stopy, pointy, piruety) od tygodnia 1; dawne ustawienia zostają w o.legacy */
function toV2(o,s){
  const t=today();
  o.legacy=Object.assign({},o.legacy,{active:Array.isArray(s.active)?s.active.slice():null,progStart:Object.assign({},s.progStart||{}),migratedAt:t});
  o.active=PLAN_IDS.slice();
  o.progStart=Object.fromEntries(PLAN_IDS.map(p=>[p,t]));
  o.mode=s.mode==='yt'?'film':'app';
  o.short=false;o.sayAuto=false;o.ms={};
  /* kamienie milowe spełnione już wcześniej: zaznaczone po cichu, bez serii świętowań */
  for(const id in MS_BY)if(msMet(id,o))o.ms[id]=t;
